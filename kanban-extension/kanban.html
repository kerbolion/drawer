<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>

<style>
*{box-sizing:border-box}

html,
body{
  height:100%;
}

:root{
  color-scheme:light;
  --site-bg:#fff;
  --site-text:#444;
  --site-heading:#30343a;
  --site-heading-rgb:48,52,58;
  --site-muted:#666;
  --site-border:#ddd;
  --site-button-bg:#fff;
  --site-button-text:#222;
  --site-secondary-button-bg:#fff;
  --site-secondary-button-text:#222;
  --site-secondary-button-border:#ddd;
  --site-shadow:#0002;
  --danger:#b42318;
  --primary-color:var(--site-heading);
  --primary-hover:color-mix(in srgb,var(--site-heading) 84%,var(--site-bg));
  --primary-color-rgb:var(--site-heading-rgb);
  --site-accent-text:var(--site-bg);
  --real-columns:3;
  --height:600px;
}

[data-theme="dark"]{
  color-scheme:dark;
  --site-bg:#1d1d1d;
  --site-text:#ededed;
  --site-heading:#f5f5f5;
  --site-heading-rgb:245,245,245;
  --site-muted:#c2c2c2;
  --site-border:#393939;
  --site-button-bg:#111;
  --site-button-text:#f5f5f5;
  --site-secondary-button-bg:var(--site-button-bg);
  --site-secondary-button-text:var(--site-button-text);
  --site-secondary-button-border:var(--site-border);
  --site-shadow:#0008;
  --danger:#ff7b72;
}

body{
  margin:0;
  display:flex;
  flex-direction:column;
  font-family:monospace;
  font-size:16px;
  background:var(--site-bg);
  color:var(--site-text);
}

.workspace-bar{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 20px 0;
  background:var(--site-bg);
}

.workspace-tabs{
  display:flex;
  flex:1;
  min-width:0;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.workspace-tab{
  display:flex;
  flex:none;
  gap:8px;
  align-items:center;
  padding:6px 12px;
  border:1px solid var(--site-border);
  border-radius:20px;
  background:var(--site-button-bg);
  color:var(--site-button-text);
  white-space:nowrap;
  cursor:grab;
}

.workspace-tab.active{
  border-color:var(--primary-color);
  background:color-mix(in srgb,var(--primary-color) 10%,var(--site-bg));
}

.workspace-count{
  min-width:22px;
  padding:2px 6px;
  border-radius:10px;
  background:color-mix(in srgb,var(--site-heading) 12%,var(--site-bg));
  color:var(--site-muted);
  font-size:11px;
  text-align:center;
}

.workspace-tab.active .workspace-count{
  background:var(--primary-color);
  color:var(--site-accent-text);
}

.add-workspace{
  flex:none;
  padding:7px 10px;
}

.add-workspace,
.data-button,
.add-column{
  border:1px solid var(--site-secondary-button-border);
  background:var(--site-secondary-button-bg);
  color:var(--site-secondary-button-text);
  border-radius:20px;
}

.data-control{
  position:relative;
  flex:none;
}

.data-button{
  padding:7px 10px;
}

.data-menu{
  position:absolute;
  z-index:9999;
  top:calc(100% + 6px);
  right:0;
  min-width:140px;
  padding:5px;
  border:1px solid var(--site-border);
  border-radius:7px;
  background:var(--site-bg);
  box-shadow:0 10px 30px var(--site-shadow);
}

.data-menu[hidden]{
  display:none;
}

.data-menu button{
  width:100%;
  padding:8px 10px;
  border-radius:5px;
  background:transparent;
  color:var(--site-button-text);
  text-align:left;
}

.data-menu button:hover{
  background:color-mix(in srgb,var(--site-heading) 8%,var(--site-bg));
}

[data-theme-toggle]{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:34px;
  border:1px solid var(--site-border);
  border-radius:999px;
  background:var(--site-button-bg);
  color:var(--site-button-text);
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

[data-theme-toggle] svg{
  display:block;
  width:20px;
  height:20px;
}

.settings{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  padding:12px 20px;
  background:var(--site-bg);
  border-bottom:1px solid var(--site-border);
  justify-content: center;
}

.settings label{
  display:flex;
  align-items:center;
  gap:6px;
}

.settings .grid-setting[hidden]{
  display:none;
}

.settings input{
  width:75px;
  padding:5px;
}

.settings select{
  padding:5px;
}

button{
  border:0;
  color:inherit;
  font:inherit;
  cursor:pointer;
}

input,
select{
  border:1px solid var(--site-border);
  background:var(--site-button-bg);
  color:var(--site-button-text);
}

.add-column{
  padding:8px 12px;
}

.kanban{
  flex:none;
  display:grid;
  overflow-anchor:none;
  grid-template-columns:repeat(var(--real-columns),minmax(0,1fr));
  gap:15px;
  padding:50px;
  width:100%;
  align-items:start;
}

.kanban.row{
  flex:1 1 0;
  min-height:0;
  grid-auto-flow:column;
  grid-auto-columns:minmax(300px,320px);
  grid-template-columns:none;
  grid-template-rows:minmax(0,1fr);
  overflow-x:auto;
}

.kanban.row .column{
  height:100%;
}

.column{
  background:color-mix(in srgb,var(--site-button-bg) 82%,var(--site-border));
  width:100%;
  min-width:0;
  height:var(--height);
  padding:10px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  cursor:grab;
}

.column.selected{
  outline:2px solid var(--primary-color);
  outline-offset:1px;
}

.column-placeholder{
  height:var(--height);
  border:2px dashed var(--primary-color);
  border-radius:8px;
  background:color-mix(in srgb,var(--primary-color) 5%,transparent);
  pointer-events:none;
}

.kanban.row .column-placeholder{
  height:100%;
}

.column-drag-source{
  position:fixed !important;
  visibility:hidden;
  pointer-events:none;
}

.column-header{
  display:flex;
  flex:none;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}

.column h3{
  flex:1;
  min-width:0;
  margin:0;
  padding:5px;
  cursor:grab;
}

.column-count{
  flex:none;
  min-width:22px;
  padding:2px 6px;
  border-radius:10px;
  background:color-mix(in srgb,var(--site-heading) 12%,var(--site-bg));
  color:var(--site-muted);
  font-size:11px;
  text-align:center;
}

.cards{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding: 10px;
}

.card{
  background:var(--site-bg);
  padding:12px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:grab;
  box-shadow:0 1px 3px var(--site-shadow);
}

.card.selected{
  outline:2px solid var(--primary-color);
  outline-offset:1px;
}

.add-card{
  flex:none;
  width:100%;
  padding:8px;
  background:transparent;
  text-align:left;
}

.dragging{
  opacity:.35;
}

html.is-dragging,
html.is-dragging *{
  cursor:grabbing !important;
  user-select:none;
}

.drag-image{
  position:fixed;
  z-index:9999;
  top:0;
  left:0;
  margin:0;
  opacity:1;
  pointer-events:none;
  transition:none;
  will-change:transform;
}

.drag-selection-count{
  position:absolute;
  top:-8px;
  right:-8px;
  min-width:22px;
  padding:3px 6px;
  border-radius:12px;
  background:var(--primary-color);
  color:var(--site-accent-text);
  font-size:11px;
  text-align:center;
}

.context-menu{
  position:fixed;
  z-index:9999;
  min-width:170px;
  padding:5px;
  border:1px solid var(--site-border);
  border-radius:7px;
  background:var(--site-bg);
  box-shadow:0 10px 30px var(--site-shadow);
}

.context-menu[hidden]{
  display:none;
}

.context-menu button{
  width:100%;
  padding:8px 10px;
  border-radius:5px;
  background:transparent;
  color:var(--site-button-text);
  text-align:left;
}

.context-menu button:hover{
  background:color-mix(in srgb,var(--site-heading) 8%,var(--site-bg));
}

.context-menu button[hidden]{
  display:none;
}

.context-menu #delete-context{
  color:var(--danger);
}

.context-menu #delete-context:hover{
  background:color-mix(in srgb,var(--danger) 10%,var(--site-bg));
}

[contenteditable="true"]{
  cursor:text;
  outline:2px solid var(--site-muted);
  background:var(--site-bg);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  display:grid;
  place-items:center;
  padding:18px;
  background:#0008;
}

.modal-backdrop[hidden]{
  display:none;
}

.modal{
  display:grid;
  width:min(420px,100%);
  gap:12px;
  border:1px solid var(--site-border);
  border-radius:8px;
  background:var(--site-bg);
  color:var(--site-text);
  padding:16px;
  box-shadow:0 18px 60px #0007;
}

.modal h2{
  margin:0;
  font-size:18px;
}

.modal p{
  margin:0;
  color:var(--site-muted);
}

.modal input{
  width:100%;
  padding:8px 10px;
}

.modal .actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.modal .actions button{
  min-height:34px;
  border:1px solid var(--site-border);
  border-radius:6px;
  background:var(--site-secondary-button-bg);
  color:var(--site-secondary-button-text);
  padding:0 11px;
  font-weight:700;
}

.modal .actions .primary{
  border-color:var(--primary-color);
  background:var(--primary-color);
  color:var(--site-accent-text);
}

.modal .actions .danger{
  color:var(--danger);
}
</style>
</head>

<body>

<nav class="workspace-bar">
  <div
    class="workspace-tabs"
    id="workspaceTabs">
  </div>

  <button class="add-workspace">
    + Tablero
  </button>

  <div class="data-control">
    <button class="data-button" type="button">
      Datos
    </button>
    <div class="data-menu" hidden>
      <button id="export-data" type="button">Exportar</button>
      <button id="import-data" type="button">Importar</button>
    </div>
  </div>

  <button type="button" data-theme-toggle title="Modo Oscuro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><g fill="currentColor"><path d="M8 4a4 4 0 1 1 0 8a4 4 0 0 1 0-8"></path><path d="M10 3h3v3l2 2l-2 2v3h-3l-2 2l-2-2H3v-3L1 8l2-2V3h3l2-2zM8 3a5 5 0 1 0 0 10A5 5 0 0 0 8 3"></path></g></svg></button>
</nav>

<div class="settings">

  <label>
    Mostrar como
    <select id="view">
      <option value="grid">GRID</option>
      <option value="row">FILA</option>
    </select>
  </label>

  <label class="grid-setting">
    Columnas por fila
    <input
      id="columns"
      type="number"
      min="1"
      max="20"
      value="3">
  </label>

  <label class="grid-setting">
    Alto
    <input
      id="height"
      type="number"
      min="150"
      value="600">
    px
  </label>

  <label class="grid-setting">
    Ancho mínimo
    <input
      id="minWidth"
      type="number"
      min="100"
      value="280">
    px
  </label>

  <button class="add-column">
    + Agregar columna
  </button>

</div>


<div class="kanban" id="kanban">

  <section class="column">

    <h3 draggable="true">Pendiente</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear landing</div>
      <div class="card" draggable="true">Diseñar formulario</div>
      <div class="card" draggable="true">Configurar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">En proceso</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear CRM</div>
      <div class="card" draggable="true">Probar extensión</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">Terminado</h3>

    <div class="cards">
      <div class="card" draggable="true">Comprar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>

</div>

<div class="context-menu" id="context-menu" hidden>
  <button id="edit-context" type="button" hidden>
    Editar
  </button>
  <button id="copy-context" type="button">
    Copiar
  </button>
  <button id="paste-context" type="button" hidden>
    Pegar
  </button>
  <button id="duplicate-context" type="button">
    Duplicar
  </button>
  <button id="delete-context" type="button">
    Eliminar
  </button>
</div>

<div class="modal-backdrop" id="confirm-modal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title">Nombre del tablero</h2>
    <p id="confirm-message">Escribe el nombre del tablero.</p>
    <input id="confirm-input" autocomplete="off">
    <input id="confirm-file" type="file" accept=".json,application/json" hidden>
    <div class="actions">
      <button id="cancel-confirm" type="button">Cancelar</button>
      <button class="primary" id="accept-confirm" type="button">Guardar</button>
    </div>
  </section>
</div>


<script src="kanban.js"></script>

</body>
</html>
