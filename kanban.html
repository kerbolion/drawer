<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>

<style>
*{box-sizing:border-box}

:root{
  --columns:3;
  --height:600px;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

.settings{
  display:flex;
  gap:15px;
  align-items:center;
  padding:12px 20px;
  background:white;
  border-bottom:1px solid #ddd;
}

.settings label{
  display:flex;
  align-items:center;
  gap:6px;
}

.settings input{
  width:70px;
  padding:5px;
}

button{
  border:0;
  cursor:pointer;
}


/* TABLERO */

.kanban{
  display:grid;
  grid-template-columns:repeat(var(--columns),minmax(0,1fr));
  gap:15px;
  padding:20px;
  width:100%;
  align-items:start;
}


/* COLUMNAS */

.column{
  background:#e9e9e9;
  width:100%;
  height:var(--height);
  padding:10px;
  border-radius:8px;

  display:flex;
  flex-direction:column;

  min-width:0;
}

.column h3{
  margin:0 0 10px;
  padding:5px;
  cursor:grab;
  flex:none;
}


/* ZONA DE TARJETAS */

.cards{
  flex:1;
  min-height:0;
  overflow-y:auto;
}


/* TARJETAS */

.card{
  background:white;
  padding:12px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:grab;
  box-shadow:0 1px 3px #0002;
  height:auto;
  min-height:0;
}


/* BOTONES */

.add-card{
  flex:none;
  width:100%;
  padding:8px;
  background:transparent;
  text-align:left;
}

.add-column{
  padding:8px 12px;
}


/* DRAG */

.dragging{
  opacity:.35;
}


/* EDICIÓN */

[contenteditable="true"]{
  cursor:text;
  outline:2px solid #999;
  background:white;
}
</style>
</head>

<body>


<div class="settings">

  <label>
    Columnas por fila

    <input
      id="columns"
      type="number"
      min="1"
      max="10"
      value="3">
  </label>


  <label>
    Alto

    <input
      id="height"
      type="number"
      min="150"
      value="600">

    px
  </label>


  <button class="add-column">
    + Agregar columna
  </button>

</div>



<div class="kanban" id="kanban">


  <section class="column">

    <h3 draggable="true">
      Pendiente
    </h3>

    <div class="cards">

      <div class="card" draggable="true">
Crear landing
      </div>

      <div class="card" draggable="true">
Diseñar formulario
      </div>

      <div class="card" draggable="true">
Configurar dominio
      </div>

      <div class="card" draggable="true">
Subir imágenes
      </div>

      <div class="card" draggable="true">
Revisar versión móvil
      </div>

      <div class="card" draggable="true">
Configurar hosting
      </div>

      <div class="card" draggable="true">
Publicar
      </div>

    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>



  <section class="column">

    <h3 draggable="true">
      En proceso
    </h3>

    <div class="cards">

      <div class="card" draggable="true">
Crear CRM
      </div>

      <div class="card" draggable="true">
Probar extensión
      </div>

    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>



  <section class="column">

    <h3 draggable="true">
      Terminado
    </h3>

    <div class="cards">

      <div class="card" draggable="true">
Comprar dominio
      </div>

    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>



  <section class="column">

    <h3 draggable="true">
      Archivado
    </h3>

    <div class="cards">

      <div class="card" draggable="true">
Proyecto antiguo
      </div>

    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


</div>



<script>
let drag


/* CONFIGURACIÓN */

columns.oninput=()=>{
  document.documentElement.style
    .setProperty('--columns',columns.value)
}

height.oninput=()=>{
  document.documentElement.style
    .setProperty('--height',height.value+'px')
}


/* EDITAR */

function editar(el,seleccionar=false){

  el.contentEditable=true
  el.draggable=false
  el.focus()

  let range=document.createRange()

  range.selectNodeContents(el)

  if(!seleccionar)
    range.collapse(false)

  let selection=window.getSelection()

  selection.removeAllRanges()
  selection.addRange(range)
}


/* INICIAR DRAG */

document.addEventListener('dragstart',e=>{

  if(e.target.matches('.card'))
    drag=e.target

  if(e.target.matches('h3'))
    drag=e.target.parentElement

  drag?.classList.add('dragging')
})


/* TERMINAR DRAG */

document.addEventListener('dragend',()=>{

  drag?.classList.remove('dragging')
  drag=null
})


/* MOVER */

document.addEventListener('dragover',e=>{

  e.preventDefault()

  if(!drag) return


  /* TARJETAS */

  if(drag.matches('.card')){

    let column=e.target.closest('.column')

    if(!column) return

    let cards=column.querySelector('.cards')

    let next=[
      ...cards.querySelectorAll(
        '.card:not(.dragging)'
      )
    ].find(card=>{

      let rect=card.getBoundingClientRect()

      return e.clientY <
        rect.top +
        rect.height/2
    })

    cards.insertBefore(
      drag,
      next || null
    )
  }


  /* COLUMNAS */

  if(drag.matches('.column')){

    let target=e.target.closest('.column')

    if(!target || target===drag)
      return

    let rect=target.getBoundingClientRect()

    let before=
      e.clientX <
      rect.left +
      rect.width/2

    if(before)
      target.before(drag)
    else
      target.after(drag)
  }

})


/* DOBLE CLIC */

document.addEventListener('dblclick',e=>{

  if(!e.target.matches('.card,h3'))
    return

  editar(e.target)
})


/* ENTER */

document.addEventListener('keydown',e=>{

  if(!e.target.isContentEditable)
    return


  /* SHIFT + ENTER EN TARJETAS */

  if(
    e.key==='Enter' &&
    e.shiftKey
  ){

    if(e.target.matches('h3')){

      e.preventDefault()
      e.target.blur()
    }

    return
  }


  /* ENTER NORMAL GUARDA */

  if(e.key==='Enter'){

    e.preventDefault()
    e.target.blur()
  }

})


/* CLIC FUERA GUARDA */

document.addEventListener(
  'blur',

  e=>{

    if(!e.target.isContentEditable)
      return

    e.target.contentEditable=false
    e.target.draggable=true

  },

  true
)


/* AGREGAR TARJETA */

document.addEventListener('click',e=>{

  if(!e.target.matches('.add-card'))
    return

  let cards=e.target
    .closest('.column')
    .querySelector('.cards')

  let card=document.createElement('div')

  card.className='card'
  card.draggable=true
  card.textContent='Nueva tarjeta'

  cards.append(card)

  card.scrollIntoView({
    block:'nearest'
  })

  editar(card,true)
})


/* AGREGAR COLUMNA */

document.querySelector('.add-column')
.onclick=()=>{

  let column=document.createElement('section')

  column.className='column'

  column.innerHTML=`
    <h3 draggable="true">Nueva columna</h3>

    <div class="cards"></div>

    <button class="add-card">
      + Agregar tarjeta
    </button>
  `

  kanban.append(column)

  editar(
    column.querySelector('h3'),
    true
  )
}
</script>

</body>
</html>
