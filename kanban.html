<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

.kanban{
  display:flex;
  gap:15px;
  padding:20px;
  overflow-x:auto;
  min-height:100vh;
  align-items:flex-start;
}

.column{
  background:#e9e9e9;
  width:280px;
  min-width:280px;
  padding:10px;
  border-radius:8px;
  height:-webkit-fill-available;
}

.column h3{
  margin:0 0 10px;
  padding:5px;
  cursor:grab;
}

.cards{
  min-height:40px;
}

.card{
  background:white;
  padding:12px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:grab;
  box-shadow:0 1px 3px #0002;
  white-space:pre-wrap;
}

button{
  border:0;
  cursor:pointer;
}

.add-card{
  width:100%;
  padding:8px;
  background:transparent;
  text-align:left;
}

.add-column{
  min-width:160px;
  padding:12px;
  border-radius:8px;
}

.dragging{
  opacity:.35;
}

[contenteditable="true"]{
  cursor:text;
  outline:2px solid #999;
  background:white;
}
</style>
</head>

<body>

<div class="kanban">

  <section class="column">
    <h3 draggable="true">Pendiente</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear landing</div>
      <div class="card" draggable="true">Diseñar formulario</div>
      <div class="card" draggable="true">Configurar dominio</div>
    </div>

    <button class="add-card">+ Agregar tarjeta</button>
  </section>


  <section class="column">
    <h3 draggable="true">En proceso</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear CRM</div>
      <div class="card" draggable="true">Probar extensión</div>
    </div>

    <button class="add-card">+ Agregar tarjeta</button>
  </section>


  <section class="column">
    <h3 draggable="true">Terminado</h3>

    <div class="cards">
      <div class="card" draggable="true">Comprar dominio</div>
    </div>

    <button class="add-card">+ Agregar tarjeta</button>
  </section>


  <button class="add-column">+ Agregar columna</button>

</div>


<script>
let drag


/* EDITAR */

function editar(el,seleccionar=false){

  el.contentEditable=true
  el.draggable=false
  el.focus()

  let range=document.createRange()
  range.selectNodeContents(el)

  if(!seleccionar)
    range.collapse(false)

  let selection=window.getSelection()
  selection.removeAllRanges()
  selection.addRange(range)
}


/* DRAG */

document.addEventListener('dragstart',e=>{

  if(e.target.matches('.card'))
    drag=e.target

  if(e.target.matches('h3'))
    drag=e.target.parentElement

  drag?.classList.add('dragging')
})


document.addEventListener('dragend',()=>{

  drag?.classList.remove('dragging')
  drag=null
})


document.addEventListener('dragover',e=>{

  e.preventDefault()

  if(!drag) return


  /* TARJETAS */

  if(drag.matches('.card')){

    let cards=e.target.closest('.cards')

    if(!cards){
      let column=e.target.closest('.column')
      cards=column?.querySelector('.cards')
    }

    if(!cards) return

    let next=[...cards.querySelectorAll('.card:not(.dragging)')]
      .find(card=>
        e.clientY <
        card.getBoundingClientRect().top +
        card.offsetHeight/2
      )

    cards.insertBefore(drag,next || null)
  }


  /* COLUMNAS */

  if(drag.matches('.column')){

    let board=e.target.closest('.kanban')

    if(!board) return

    let columns=[
      ...board.querySelectorAll('.column:not(.dragging)')
    ]

    let next=columns.find(column=>
      e.clientX <
      column.getBoundingClientRect().left +
      column.offsetWidth/2
    )

    board.insertBefore(
      drag,
      next || board.querySelector('.add-column')
    )
  }
})


/* DOBLE CLIC PARA EDITAR */

document.addEventListener('dblclick',e=>{

  if(!e.target.matches('.card,h3')) return

  editar(e.target)
})


/* ENTER GUARDA / SHIFT + ENTER SALTO */

document.addEventListener('keydown',e=>{

  if(!e.target.isContentEditable) return


  /* Shift + Enter = salto */

  if(e.key==='Enter' && e.shiftKey){

    /* En títulos no permitimos varias líneas */

    if(e.target.matches('h3')){
      e.preventDefault()
      e.target.blur()
    }

    return
  }


  /* Enter normal = guardar */

  if(e.key==='Enter'){

    e.preventDefault()
    e.target.blur()
  }
})


/* CLIC FUERA = GUARDAR */

document.addEventListener('blur',e=>{

  if(!e.target.isContentEditable) return

  e.target.contentEditable=false
  e.target.draggable=true

},true)


/* AGREGAR TARJETA */

document.addEventListener('click',e=>{

  if(!e.target.matches('.add-card')) return

  let cards=e.target
    .closest('.column')
    .querySelector('.cards')

  let card=document.createElement('div')

  card.className='card'
  card.draggable=true
  card.textContent='Nueva tarjeta'

  cards.append(card)

  editar(card,true)
})


/* AGREGAR COLUMNA */

document.querySelector('.add-column').onclick=function(){

  let column=document.createElement('section')

  column.className='column'

  column.innerHTML=`
    <h3 draggable="true">Nueva columna</h3>

    <div class="cards"></div>

    <button class="add-card">
      + Agregar tarjeta
    </button>
  `

  this.before(column)

  editar(
    column.querySelector('h3'),
    true
  )
}
</script>

</body>
</html>
