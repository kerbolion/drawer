<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>

<style>
*{box-sizing:border-box}

:root{
  color-scheme:light;
  --site-bg:#fff;
  --site-text:#444;
  --site-heading:#30343a;
  --site-heading-rgb:48,52,58;
  --site-muted:#666;
  --site-border:#ddd;
  --site-button-bg:#fff;
  --site-button-text:#222;
  --site-secondary-button-bg:#fff;
  --site-secondary-button-text:#222;
  --site-secondary-button-border:#ddd;
  --site-shadow:#0002;
  --danger:#b42318;
  --primary-color:var(--site-heading);
  --primary-hover:color-mix(in srgb,var(--site-heading) 84%,var(--site-bg));
  --primary-color-rgb:var(--site-heading-rgb);
  --site-accent-text:var(--site-bg);
  --real-columns:3;
  --height:600px;
}

[data-theme="dark"]{
  color-scheme:dark;
  --site-bg:#1d1d1d;
  --site-text:#ededed;
  --site-heading:#f5f5f5;
  --site-heading-rgb:245,245,245;
  --site-muted:#c2c2c2;
  --site-border:#393939;
  --site-button-bg:#111;
  --site-button-text:#f5f5f5;
  --site-secondary-button-bg:var(--site-button-bg);
  --site-secondary-button-text:var(--site-button-text);
  --site-secondary-button-border:var(--site-border);
  --site-shadow:#0008;
  --danger:#ff7b72;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--site-bg);
  color:var(--site-text);
}

.workspace-bar{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 20px 0;
  background:var(--site-bg);
}

.workspace-tabs{
  display:flex;
  flex:1;
  min-width:0;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.workspace-tab{
  display:flex;
  flex:none;
  gap:8px;
  align-items:center;
  padding:6px 12px;
  border:1px solid var(--site-border);
  border-radius:20px;
  background:var(--site-button-bg);
  color:var(--site-button-text);
  white-space:nowrap;
}

.workspace-tab.active{
  border-color:var(--primary-color);
  background:color-mix(in srgb,var(--primary-color) 10%,var(--site-bg));
}

.workspace-count{
  min-width:22px;
  padding:2px 6px;
  border-radius:10px;
  background:color-mix(in srgb,var(--site-heading) 12%,var(--site-bg));
  color:var(--site-muted);
  font-size:11px;
  text-align:center;
}

.workspace-tab.active .workspace-count{
  background:var(--primary-color);
  color:var(--site-accent-text);
}

.add-workspace{
  flex:none;
  padding:7px 10px;
}

.add-workspace,
.add-column{
  border:1px solid var(--site-secondary-button-border);
  background:var(--site-secondary-button-bg);
  color:var(--site-secondary-button-text);
  border-radius:20px;
}

[data-theme-toggle]{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:34px;
  border:1px solid var(--site-border);
  border-radius:999px;
  background:var(--site-button-bg);
  color:var(--site-button-text);
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

[data-theme-toggle] svg{
  display:block;
  width:20px;
  height:20px;
}

.settings{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  padding:12px 20px;
  background:var(--site-bg);
  border-bottom:1px solid var(--site-border);
  justify-content: center;
}

.settings label{
  display:flex;
  align-items:center;
  gap:6px;
}

.settings input{
  width:75px;
  padding:5px;
}

.settings select{
  padding:5px;
}

button{
  border:0;
  color:inherit;
  font:inherit;
  cursor:pointer;
}

input,
select{
  border:1px solid var(--site-border);
  background:var(--site-button-bg);
  color:var(--site-button-text);
}

.add-column{
  padding:8px 12px;
}

.kanban{
  display:grid;
  grid-template-columns:repeat(var(--real-columns),minmax(0,1fr));
  gap:15px;
  padding:20px;
  width:100%;
  align-items:start;
}

.kanban.row{
  grid-auto-flow:column;
  grid-auto-columns:minmax(300px,320px);
  grid-template-columns:none;
  overflow-x:auto;
}

.kanban.row .column{
  height:600px;
}

.column{
  background:color-mix(in srgb,var(--site-button-bg) 82%,var(--site-border));
  width:100%;
  min-width:0;
  height:var(--height);
  padding:10px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
}

.column h3{
  margin:0 0 10px;
  padding:5px;
  cursor:grab;
  flex:none;
}

.cards{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding: 10px;
}

.card{
  background:var(--site-bg);
  padding:12px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:grab;
  box-shadow:0 1px 3px var(--site-shadow);
}

.add-card{
  flex:none;
  width:100%;
  padding:8px;
  background:transparent;
  text-align:left;
}

.dragging{
  opacity:.35;
}

.drag-image{
  position:fixed;
  z-index:9999;
  top:0;
  left:0;
  margin:0;
  opacity:1;
  pointer-events:none;
  transition:none;
  will-change:transform;
}

[contenteditable="true"]{
  cursor:text;
  outline:2px solid var(--site-muted);
  background:var(--site-bg);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  display:grid;
  place-items:center;
  padding:18px;
  background:#0008;
}

.modal-backdrop[hidden]{
  display:none;
}

.modal{
  display:grid;
  width:min(420px,100%);
  gap:12px;
  border:1px solid var(--site-border);
  border-radius:8px;
  background:var(--site-bg);
  color:var(--site-text);
  padding:16px;
  box-shadow:0 18px 60px #0007;
}

.modal h2{
  margin:0;
  font-size:18px;
}

.modal p{
  margin:0;
  color:var(--site-muted);
}

.modal input{
  width:100%;
  padding:8px 10px;
}

.modal .actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.modal .actions button{
  min-height:34px;
  border:1px solid var(--site-border);
  border-radius:6px;
  background:var(--site-secondary-button-bg);
  color:var(--site-secondary-button-text);
  padding:0 11px;
  font-weight:700;
}

.modal .actions .primary{
  border-color:var(--primary-color);
  background:var(--primary-color);
  color:var(--site-accent-text);
}

.modal .actions .danger{
  color:var(--danger);
}
</style>
</head>

<body>

<nav class="workspace-bar">
  <div
    class="workspace-tabs"
    id="workspaceTabs">
  </div>

  <button class="add-workspace">
    + Tablero
  </button>

  <button type="button" data-theme-toggle title="Modo Oscuro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><g fill="currentColor"><path d="M8 4a4 4 0 1 1 0 8a4 4 0 0 1 0-8"></path><path d="M10 3h3v3l2 2l-2 2v3h-3l-2 2l-2-2H3v-3L1 8l2-2V3h3l2-2zM8 3a5 5 0 1 0 0 10A5 5 0 0 0 8 3"></path></g></svg></button>
</nav>

<div class="settings">

  <label>
    Mostrar como
    <select id="view">
      <option value="grid">GRID</option>
      <option value="row">FILA</option>
    </select>
  </label>

  <label class="grid-setting">
    Columnas por fila
    <input
      id="columns"
      type="number"
      min="1"
      max="20"
      value="3">
  </label>

  <label class="grid-setting">
    Alto
    <input
      id="height"
      type="number"
      min="150"
      value="600">
    px
  </label>

  <label class="grid-setting">
    Ancho mínimo
    <input
      id="minWidth"
      type="number"
      min="100"
      value="280">
    px
  </label>

  <button class="add-column">
    + Agregar columna
  </button>

</div>


<div class="kanban" id="kanban">

  <section class="column">

    <h3 draggable="true">Pendiente</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear landing</div>
      <div class="card" draggable="true">Diseñar formulario</div>
      <div class="card" draggable="true">Configurar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">En proceso</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear CRM</div>
      <div class="card" draggable="true">Probar extensión</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">Terminado</h3>

    <div class="cards">
      <div class="card" draggable="true">Comprar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>

</div>

<div class="modal-backdrop" id="confirm-modal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title">Nombre del tablero</h2>
    <p id="confirm-message">Escribe el nombre del tablero.</p>
    <input id="confirm-input" autocomplete="off">
    <div class="actions">
      <button id="cancel-confirm" type="button">Cancelar</button>
      <button class="primary" id="accept-confirm" type="button">Guardar</button>
    </div>
  </section>
</div>


<script>
const STORAGE='kanban-data'
const THEME_STORAGE='minimal-builder-theme'
const COLUMN_MOVE_MARGIN=16

const confirmModal=
  document.querySelector('#confirm-modal')

const confirmTitle=
  document.querySelector('#confirm-title')

const confirmMessage=
  document.querySelector('#confirm-message')

const confirmInput=
  document.querySelector('#confirm-input')

const cancelConfirm=
  document.querySelector('#cancel-confirm')

const acceptConfirm=
  document.querySelector('#accept-confirm')

let resolveModal


function cerrarModal(value=null){

  confirmModal.hidden=true
  resolveModal?.(value)
  resolveModal=null
}


function pedirNombre(title,message,value=''){

  confirmTitle.textContent=title
  confirmMessage.textContent=message
  confirmInput.value=value
  confirmModal.hidden=false

  requestAnimationFrame(()=>{
    confirmInput.focus()
    confirmInput.select()
  })

  return new Promise(resolve=>{
    resolveModal=resolve
  })
}


cancelConfirm.onclick=()=>cerrarModal()

acceptConfirm.onclick=()=>
  cerrarModal(confirmInput.value)

confirmModal.onclick=e=>{

  if(e.target===confirmModal)
    cerrarModal()
}

confirmInput.onkeydown=e=>{

  if(e.key==='Enter')
    cerrarModal(confirmInput.value)

  if(e.key==='Escape')
    cerrarModal()
}

const themeToggle=
  document.querySelector('[data-theme-toggle]')

const sunIcon=themeToggle.innerHTML
const moonIcon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><g fill="currentColor"><path d="M6 .278a.77.77 0 0 1 .08.858a7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316a.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71C0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"></path><path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"></path></g></svg>'

function aplicarTema(theme){

  document.documentElement.dataset.theme=theme

  let dark=theme==='dark'

  themeToggle.innerHTML=dark ? moonIcon : sunIcon
  themeToggle.title=`Modo ${dark ? 'Claro' : 'Oscuro'}`
}

let storedTheme=localStorage.getItem(THEME_STORAGE)

aplicarTema(
  storedTheme==='dark' || storedTheme==='light'
    ? storedTheme
    : matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark'
      : 'light'
)

themeToggle.onclick=()=>{

  let next=
    document.documentElement.dataset.theme==='dark'
      ? 'light'
      : 'dark'

  localStorage.setItem(THEME_STORAGE,next)
  aplicarTema(next)
}

let drag
let dragImage
let dragImageOffset={x:0,y:0}
let columnMoveAnchor
let workspaces=[]
let activeWorkspace=''


function moverDragImage(x,y){

  if(!dragImage)
    return

  dragImage.style.transform=
    `translate3d(${x-dragImageOffset.x}px,${y-dragImageOffset.y}px,0)`
}


function crearDragImage(element,e){

  let rect=element.getBoundingClientRect()

  dragImage?.remove()
  dragImage=element.cloneNode(true)
  dragImage.classList.remove('dragging')
  dragImage.classList.add('drag-image')
  dragImage.setAttribute('aria-hidden','true')
  dragImage.style.width=rect.width+'px'
  dragImage.style.height=rect.height+'px'

  dragImage
    .querySelectorAll('[draggable]')
    .forEach(item=>item.draggable=false)

  dragImage.draggable=false
  dragImageOffset={
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  }

  document.body.append(dragImage)

  let sourceCards=
    element.querySelector?.('.cards')

  let previewCards=
    dragImage.querySelector?.('.cards')

  if(sourceCards && previewCards)
    previewCards.scrollTop=sourceCards.scrollTop

  moverDragImage(e.clientX,e.clientY)

  let transparent=
    document.createElement('canvas')

  transparent.width=1
  transparent.height=1

  e.dataTransfer.effectAllowed='move'
  e.dataTransfer.setData('text/plain','')
  e.dataTransfer.setDragImage(transparent,0,0)
}


function eliminarDragImage(){

  dragImage?.remove()
  dragImage=null
}


function ajustarColumnas(){

  let grid=
    view.value==='grid'

  kanban.classList.toggle(
    'row',
    !grid
  )

  document.querySelectorAll('.grid-setting')
    .forEach(setting=>setting.hidden=!grid)

  if(!grid)
    return

  let deseadas=Math.max(
    1,
    Number(columns.value) || 1
  )

  let minimo=Math.max(
    100,
    Number(minWidth.value) || 100
  )

  let gap=15

  let ancho=
    kanban.clientWidth - 40

  let caben=Math.max(
    1,
    Math.floor(
      (ancho + gap) /
      (minimo + gap)
    )
  )

  let reales=Math.min(
    deseadas,
    caben
  )

  document.documentElement.style
    .setProperty(
      '--real-columns',
      reales
    )
}


function leerTablero(){

  return [
    ...kanban.querySelectorAll('.column')
  ].map(column=>({

    title:
      column.querySelector('h3').innerHTML,

    cards:[
      ...column.querySelectorAll('.card')
    ].map(card=>card.innerHTML)
  }))
}


function crearColumna(item={}){

  let column=
    document.createElement('section')

  column.className='column'

  column.innerHTML=`
    <h3 draggable="true"></h3>
    <div class="cards"></div>
    <button class="add-card">
      + Agregar tarjeta
    </button>
  `

  column.querySelector('h3')
    .innerHTML=item.title || 'Nueva columna'

  let cards=
    column.querySelector('.cards')

  ;(item.cards || []).forEach(text=>{

    let card=
      document.createElement('div')

    card.className='card'
    card.draggable=true
    card.innerHTML=text

    cards.append(card)
  })

  return column
}


function dibujarTablero(board){

  kanban.replaceChildren(
    ...(board || []).map(crearColumna)
  )
}


function dibujarWorkspaces(){

  workspaceTabs.replaceChildren(
    ...workspaces.map(workspace=>{

      let button=
        document.createElement('button')

      let name=
        document.createElement('span')

      let count=
        document.createElement('span')

      button.className=
        'workspace-tab' +
        (workspace.id===activeWorkspace
          ? ' active'
          : '')

      button.dataset.workspace=workspace.id
      button.type='button'

      name.textContent=workspace.title
      count.className='workspace-count'
      count.textContent=(workspace.board || [])
        .reduce(
          (total,column)=>
            total+(column.cards || []).length,
          0
        )

      button.append(name,count)

      return button
    })
  )

  requestAnimationFrame(()=>{

    workspaceTabs
      .querySelector('.workspace-tab.active')
      ?.scrollIntoView({
        block:'nearest',
        inline:'nearest'
      })
  })
}


function guardar(){

  let current=
    workspaces.find(
      workspace=>workspace.id===activeWorkspace
    )

  if(current)
    current.board=leerTablero()

  let data={

    columns:columns.value,
    height:height.value,
    minWidth:minWidth.value,
    view:view.value,
    activeWorkspace,
    workspaces
  }

  localStorage.setItem(
    STORAGE,
    JSON.stringify(data)
  )

  dibujarWorkspaces()
}


function cargar(){

  let initialBoard=
    leerTablero()

  let raw=
    localStorage.getItem(STORAGE)

  let data={}

  if(raw){
    try{
      data=JSON.parse(raw)
    }catch{
      data={}
    }
  }


  columns.value=
    data.columns || 3

  height.value=
    data.height || 600

  minWidth.value=
    data.minWidth || 280

  view.value=
    data.view==='row' ? 'row' : 'grid'


  document.documentElement.style
    .setProperty(
      '--height',
      height.value+'px'
    )


  workspaces=Array.isArray(data.workspaces) &&
    data.workspaces.length
      ? data.workspaces.map((workspace,index)=>({
          id:String(workspace.id || `workspace-${index+1}`),
          title:String(workspace.title || `Tablero ${index+1}`),
          board:Array.isArray(workspace.board)
            ? workspace.board
            : []
        }))
      : [{
          id:'workspace-1',
          title:'Tablero 1',
          board:Array.isArray(data.board)
            ? data.board
            : initialBoard
        }]

  activeWorkspace=workspaces.some(
    workspace=>workspace.id===data.activeWorkspace
  )
    ? data.activeWorkspace
    : workspaces[0].id

  dibujarTablero(
    workspaces.find(
      workspace=>workspace.id===activeWorkspace
    ).board
  )

  ajustarColumnas()
  guardar()
}


function editar(el,seleccionar=false){

  el.contentEditable=true
  el.draggable=false
  el.focus()

  let range=
    document.createRange()

  range.selectNodeContents(el)

  if(!seleccionar)
    range.collapse(false)

  let selection=
    window.getSelection()

  selection.removeAllRanges()
  selection.addRange(range)
}


columns.oninput=()=>{

  ajustarColumnas()
  guardar()
}


view.onchange=()=>{

  ajustarColumnas()
  guardar()
}


height.oninput=()=>{

  document.documentElement.style
    .setProperty(
      '--height',
      height.value+'px'
    )

  guardar()
}


minWidth.oninput=()=>{

  ajustarColumnas()
  guardar()
}


window.addEventListener(
  'resize',
  ajustarColumnas
)


document.addEventListener(
  'dragstart',
  e=>{

    if(e.target.matches('.card'))
      drag=e.target

    if(e.target.matches('h3'))
      drag=e.target.parentElement

    if(!drag)
      return

    columnMoveAnchor=null
    crearDragImage(drag,e)
    drag.classList.add('dragging')
  }
)


document.addEventListener(
  'drag',
  e=>{

    if(
      dragImage &&
      (e.clientX || e.clientY)
    )
      moverDragImage(e.clientX,e.clientY)
  }
)


document.addEventListener(
  'dragend',
  ()=>{

    drag?.classList.remove('dragging')
    eliminarDragImage()

    drag=null
    columnMoveAnchor=null

    guardar()
  }
)


document.addEventListener(
  'dragover',
  e=>{

    e.preventDefault()

    if(dragImage)
      moverDragImage(e.clientX,e.clientY)

    if(!drag)
      return


    if(drag.matches('.card')){

      let column=
        e.target.closest('.column')

      if(!column)
        return

      let cards=
        column.querySelector('.cards')

      let next=[
        ...cards.querySelectorAll(
          '.card:not(.dragging)'
        )
      ].find(card=>{

        let rect=
          card.getBoundingClientRect()

        return e.clientY <
          rect.top +
          rect.height/2
      })

      cards.insertBefore(
        drag,
        next || null
      )

      return
    }


    if(drag.matches('.column')){

      if(
        columnMoveAnchor &&
        Math.hypot(
          e.clientX-columnMoveAnchor.x,
          e.clientY-columnMoveAnchor.y
        ) < COLUMN_MOVE_MARGIN
      )
        return

      let hovered=
        e.target.closest('.column')

      if(hovered===drag)
        return

      let candidates=[
        ...kanban.querySelectorAll(
          '.column:not(.dragging)'
        )
      ]

      if(!candidates.length){
        kanban.append(drag)
        return
      }

      let target=hovered ||
        candidates.reduce(
          (nearest,column)=>{

            let rect=
              column.getBoundingClientRect()

            let dx=
              e.clientX < rect.left
                ? rect.left-e.clientX
                : e.clientX > rect.right
                  ? e.clientX-rect.right
                  : 0

            let dy=
              e.clientY < rect.top
                ? rect.top-e.clientY
                : e.clientY > rect.bottom
                  ? e.clientY-rect.bottom
                  : 0

            let distance=
              dx*dx + dy*dy

            return !nearest ||
              distance < nearest.distance
                ? {column,distance}
                : nearest
          },
          null
        ).column

      let ordered=[
        ...kanban.querySelectorAll('.column')
      ]

      if(
        ordered.indexOf(drag) <
        ordered.indexOf(target)
      )
        target.after(drag)
      else
        target.before(drag)

      columnMoveAnchor={
        x:e.clientX,
        y:e.clientY
      }
    }
  }
)


document.addEventListener(
  'dblclick',
  e=>{

    if(
      !e.target.matches('.card,h3')
    )
      return

    editar(e.target)
  }
)


document.addEventListener(
  'keydown',
  e=>{

    if(
      !e.target.isContentEditable
    )
      return


    if(
      e.key==='Enter' &&
      e.shiftKey
    ){

      if(e.target.matches('h3')){

        e.preventDefault()
        e.target.blur()
      }

      return
    }


    if(e.key==='Enter'){

      e.preventDefault()
      e.target.blur()
    }
  }
)


document.addEventListener(
  'blur',
  e=>{

    if(
      !e.target.isContentEditable
    )
      return

    e.target.contentEditable=false
    e.target.draggable=true

    guardar()
  },
  true
)


document.addEventListener(
  'click',
  e=>{

    if(
      !e.target.matches('.add-card')
    )
      return

    let cards=
      e.target
        .closest('.column')
        .querySelector('.cards')

    let card=
      document.createElement('div')

    card.className='card'
    card.draggable=true
    card.textContent='Nueva tarjeta'

    cards.append(card)

    card.scrollIntoView({
      block:'nearest'
    })

    guardar()

    editar(
      card,
      true
    )
  }
)


workspaceTabs.addEventListener(
  'click',
  e=>{

    let tab=
      e.target.closest('.workspace-tab')

    if(
      !tab ||
      tab.dataset.workspace===activeWorkspace
    )
      return

    guardar()

    activeWorkspace=
      tab.dataset.workspace

    dibujarTablero(
      workspaces.find(
        workspace=>workspace.id===activeWorkspace
      ).board
    )

    ajustarColumnas()
    guardar()
  }
)


workspaceTabs.addEventListener(
  'dblclick',
  async e=>{

    let tab=
      e.target.closest('.workspace-tab')

    if(!tab)
      return

    let workspace=
      workspaces.find(
        item=>item.id===tab.dataset.workspace
      )

    let title=await pedirNombre(
      'Renombrar tablero',
      'Escribe el nuevo nombre del tablero.',
      workspace.title
    )

    if(!title?.trim())
      return

    workspace.title=title.trim()
    guardar()
  }
)


workspaceTabs.addEventListener(
  'wheel',
  e=>{

    if(
      workspaceTabs.scrollWidth <=
      workspaceTabs.clientWidth
    )
      return

    e.preventDefault()
    workspaceTabs.scrollLeft+=
      e.deltaY || e.deltaX
  },
  {passive:false}
)


document.querySelector('.add-workspace')
.onclick=async()=>{

  let suggested=
    `Tablero ${workspaces.length+1}`

  let title=await pedirNombre(
    'Agregar tablero',
    'Escribe el nombre del nuevo tablero.',
    suggested
  )

  if(title===null)
    return

  guardar()

  let id=
    crypto.randomUUID?.() ||
    `workspace-${Date.now()}`

  workspaces.push({
    id,
    title:title.trim() || suggested,
    board:[{
      title:'Nueva columna',
      cards:[]
    }]
  })

  activeWorkspace=id

  dibujarTablero(
    workspaces.at(-1).board
  )

  ajustarColumnas()
  guardar()
}


document.querySelector('.add-column')
.onclick=()=>{

  let column=crearColumna()

  kanban.append(column)

  ajustarColumnas()
  guardar()

  editar(
    column.querySelector('h3'),
    true
  )
}


window.addEventListener(
  'pagehide',
  guardar
)


cargar()
</script>

</body>
</html>
