<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>

<style>
*{box-sizing:border-box}

html,
body{
  height:100%;
}

:root{
  color-scheme:light;
  --site-bg:#fff;
  --site-text:#444;
  --site-heading:#30343a;
  --site-heading-rgb:48,52,58;
  --site-muted:#666;
  --site-border:#ddd;
  --site-button-bg:#fff;
  --site-button-text:#222;
  --site-secondary-button-bg:#fff;
  --site-secondary-button-text:#222;
  --site-secondary-button-border:#ddd;
  --site-shadow:#0002;
  --danger:#b42318;
  --primary-color:var(--site-heading);
  --primary-hover:color-mix(in srgb,var(--site-heading) 84%,var(--site-bg));
  --primary-color-rgb:var(--site-heading-rgb);
  --site-accent-text:var(--site-bg);
  --real-columns:3;
  --height:600px;
}

[data-theme="dark"]{
  color-scheme:dark;
  --site-bg:#1d1d1d;
  --site-text:#ededed;
  --site-heading:#f5f5f5;
  --site-heading-rgb:245,245,245;
  --site-muted:#c2c2c2;
  --site-border:#393939;
  --site-button-bg:#111;
  --site-button-text:#f5f5f5;
  --site-secondary-button-bg:var(--site-button-bg);
  --site-secondary-button-text:var(--site-button-text);
  --site-secondary-button-border:var(--site-border);
  --site-shadow:#0008;
  --danger:#ff7b72;
}

body{
  margin:0;
  display:flex;
  flex-direction:column;
  font-family:monospace;
  font-size:16px;
  background:var(--site-bg);
  color:var(--site-text);
}

.workspace-bar{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 20px 0;
  background:var(--site-bg);
}

.workspace-tabs{
  display:flex;
  flex:1;
  min-width:0;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.workspace-tab{
  display:flex;
  flex:none;
  gap:8px;
  align-items:center;
  padding:6px 12px;
  border:1px solid var(--site-border);
  border-radius:20px;
  background:var(--site-button-bg);
  color:var(--site-button-text);
  white-space:nowrap;
  cursor:grab;
}

.workspace-tab.active{
  border-color:var(--primary-color);
  background:color-mix(in srgb,var(--primary-color) 10%,var(--site-bg));
}

.workspace-count{
  min-width:22px;
  padding:2px 6px;
  border-radius:10px;
  background:color-mix(in srgb,var(--site-heading) 12%,var(--site-bg));
  color:var(--site-muted);
  font-size:11px;
  text-align:center;
}

.workspace-tab.active .workspace-count{
  background:var(--primary-color);
  color:var(--site-accent-text);
}

.add-workspace{
  flex:none;
  padding:7px 10px;
}

.add-workspace,
.data-button,
.add-column{
  border:1px solid var(--site-secondary-button-border);
  background:var(--site-secondary-button-bg);
  color:var(--site-secondary-button-text);
  border-radius:20px;
}

.data-control{
  position:relative;
  flex:none;
}

.data-button{
  padding:7px 10px;
}

.data-menu{
  position:absolute;
  z-index:9999;
  top:calc(100% + 6px);
  right:0;
  min-width:140px;
  padding:5px;
  border:1px solid var(--site-border);
  border-radius:7px;
  background:var(--site-bg);
  box-shadow:0 10px 30px var(--site-shadow);
}

.data-menu[hidden]{
  display:none;
}

.data-menu button{
  width:100%;
  padding:8px 10px;
  border-radius:5px;
  background:transparent;
  color:var(--site-button-text);
  text-align:left;
}

.data-menu button:hover{
  background:color-mix(in srgb,var(--site-heading) 8%,var(--site-bg));
}

[data-theme-toggle]{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:34px;
  border:1px solid var(--site-border);
  border-radius:999px;
  background:var(--site-button-bg);
  color:var(--site-button-text);
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

[data-theme-toggle] svg{
  display:block;
  width:20px;
  height:20px;
}

.settings{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  padding:12px 20px;
  background:var(--site-bg);
  border-bottom:1px solid var(--site-border);
  justify-content: center;
}

.settings label{
  display:flex;
  align-items:center;
  gap:6px;
}

.settings .grid-setting[hidden]{
  display:none;
}

.settings input{
  width:75px;
  padding:5px;
}

.settings select{
  padding:5px;
}

button{
  border:0;
  color:inherit;
  font:inherit;
  cursor:pointer;
}

input,
select{
  border:1px solid var(--site-border);
  background:var(--site-button-bg);
  color:var(--site-button-text);
}

.add-column{
  padding:8px 12px;
}

.kanban{
  flex:none;
  display:grid;
  overflow-anchor:none;
  grid-template-columns:repeat(var(--real-columns),minmax(0,1fr));
  gap:15px;
  padding:50px;
  width:100%;
  align-items:start;
}

.kanban.row{
  flex:1 1 0;
  min-height:0;
  grid-auto-flow:column;
  grid-auto-columns:minmax(300px,320px);
  grid-template-columns:none;
  grid-template-rows:minmax(0,1fr);
  overflow-x:auto;
}

.kanban.row .column{
  height:100%;
}

.column{
  background:color-mix(in srgb,var(--site-button-bg) 82%,var(--site-border));
  width:100%;
  min-width:0;
  height:var(--height);
  padding:10px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
}

.column.selected{
  outline:2px solid var(--primary-color);
  outline-offset:1px;
}

.column-header{
  display:flex;
  flex:none;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}

.column h3{
  flex:1;
  min-width:0;
  margin:0;
  padding:5px;
  cursor:grab;
}

.column-count{
  flex:none;
  min-width:22px;
  padding:2px 6px;
  border-radius:10px;
  background:color-mix(in srgb,var(--site-heading) 12%,var(--site-bg));
  color:var(--site-muted);
  font-size:11px;
  text-align:center;
}

.cards{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding: 10px;
}

.card{
  background:var(--site-bg);
  padding:12px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:grab;
  box-shadow:0 1px 3px var(--site-shadow);
}

.card.selected{
  outline:2px solid var(--primary-color);
  outline-offset:1px;
}

.add-card{
  flex:none;
  width:100%;
  padding:8px;
  background:transparent;
  text-align:left;
}

.dragging{
  opacity:.35;
}

html.is-dragging,
html.is-dragging *{
  cursor:grabbing !important;
  user-select:none;
}

.drag-image{
  position:fixed;
  z-index:9999;
  top:0;
  left:0;
  margin:0;
  opacity:1;
  pointer-events:none;
  transition:none;
  will-change:transform;
}

.drag-selection-count{
  position:absolute;
  top:-8px;
  right:-8px;
  min-width:22px;
  padding:3px 6px;
  border-radius:12px;
  background:var(--primary-color);
  color:var(--site-accent-text);
  font-size:11px;
  text-align:center;
}

.context-menu{
  position:fixed;
  z-index:9999;
  min-width:170px;
  padding:5px;
  border:1px solid var(--site-border);
  border-radius:7px;
  background:var(--site-bg);
  box-shadow:0 10px 30px var(--site-shadow);
}

.context-menu[hidden]{
  display:none;
}

.context-menu button{
  width:100%;
  padding:8px 10px;
  border-radius:5px;
  background:transparent;
  color:var(--site-button-text);
  text-align:left;
}

.context-menu button:hover{
  background:color-mix(in srgb,var(--site-heading) 8%,var(--site-bg));
}

.context-menu button[hidden]{
  display:none;
}

.context-menu #delete-context{
  color:var(--danger);
}

.context-menu #delete-context:hover{
  background:color-mix(in srgb,var(--danger) 10%,var(--site-bg));
}

[contenteditable="true"]{
  cursor:text;
  outline:2px solid var(--site-muted);
  background:var(--site-bg);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  display:grid;
  place-items:center;
  padding:18px;
  background:#0008;
}

.modal-backdrop[hidden]{
  display:none;
}

.modal{
  display:grid;
  width:min(420px,100%);
  gap:12px;
  border:1px solid var(--site-border);
  border-radius:8px;
  background:var(--site-bg);
  color:var(--site-text);
  padding:16px;
  box-shadow:0 18px 60px #0007;
}

.modal h2{
  margin:0;
  font-size:18px;
}

.modal p{
  margin:0;
  color:var(--site-muted);
}

.modal input{
  width:100%;
  padding:8px 10px;
}

.modal .actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.modal .actions button{
  min-height:34px;
  border:1px solid var(--site-border);
  border-radius:6px;
  background:var(--site-secondary-button-bg);
  color:var(--site-secondary-button-text);
  padding:0 11px;
  font-weight:700;
}

.modal .actions .primary{
  border-color:var(--primary-color);
  background:var(--primary-color);
  color:var(--site-accent-text);
}

.modal .actions .danger{
  color:var(--danger);
}
</style>
</head>

<body>

<nav class="workspace-bar">
  <div
    class="workspace-tabs"
    id="workspaceTabs">
  </div>

  <button class="add-workspace">
    + Tablero
  </button>

  <div class="data-control">
    <button class="data-button" type="button">
      Datos
    </button>
    <div class="data-menu" hidden>
      <button id="export-data" type="button">Exportar</button>
      <button id="import-data" type="button">Importar</button>
    </div>
  </div>

  <button type="button" data-theme-toggle title="Modo Oscuro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><g fill="currentColor"><path d="M8 4a4 4 0 1 1 0 8a4 4 0 0 1 0-8"></path><path d="M10 3h3v3l2 2l-2 2v3h-3l-2 2l-2-2H3v-3L1 8l2-2V3h3l2-2zM8 3a5 5 0 1 0 0 10A5 5 0 0 0 8 3"></path></g></svg></button>
</nav>

<div class="settings">

  <label>
    Mostrar como
    <select id="view">
      <option value="grid">GRID</option>
      <option value="row">FILA</option>
    </select>
  </label>

  <label class="grid-setting">
    Columnas por fila
    <input
      id="columns"
      type="number"
      min="1"
      max="20"
      value="3">
  </label>

  <label class="grid-setting">
    Alto
    <input
      id="height"
      type="number"
      min="150"
      value="600">
    px
  </label>

  <label class="grid-setting">
    Ancho mínimo
    <input
      id="minWidth"
      type="number"
      min="100"
      value="280">
    px
  </label>

  <button class="add-column">
    + Agregar columna
  </button>

</div>


<div class="kanban" id="kanban">

  <section class="column">

    <h3 draggable="true">Pendiente</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear landing</div>
      <div class="card" draggable="true">Diseñar formulario</div>
      <div class="card" draggable="true">Configurar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">En proceso</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear CRM</div>
      <div class="card" draggable="true">Probar extensión</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">Terminado</h3>

    <div class="cards">
      <div class="card" draggable="true">Comprar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>

</div>

<div class="context-menu" id="context-menu" hidden>
  <button id="edit-context" type="button" hidden>
    Editar
  </button>
  <button id="copy-context" type="button">
    Copiar
  </button>
  <button id="paste-context" type="button" hidden>
    Pegar
  </button>
  <button id="duplicate-context" type="button">
    Duplicar
  </button>
  <button id="delete-context" type="button">
    Eliminar
  </button>
</div>

<div class="modal-backdrop" id="confirm-modal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title">Nombre del tablero</h2>
    <p id="confirm-message">Escribe el nombre del tablero.</p>
    <input id="confirm-input" autocomplete="off">
    <input id="confirm-file" type="file" accept=".json,application/json" hidden>
    <div class="actions">
      <button id="cancel-confirm" type="button">Cancelar</button>
      <button class="primary" id="accept-confirm" type="button">Guardar</button>
    </div>
  </section>
</div>


<script>
const STORAGE='kanban-data'
const THEME_STORAGE='minimal-builder-theme'
const COLUMN_MOVE_MARGIN=16
const DEFAULT_SETTINGS={
  columns:'3',
  height:'600',
  minWidth:'280',
  view:'grid'
}

const confirmModal=
  document.querySelector('#confirm-modal')

const confirmTitle=
  document.querySelector('#confirm-title')

const confirmMessage=
  document.querySelector('#confirm-message')

const confirmInput=
  document.querySelector('#confirm-input')

const confirmFile=
  document.querySelector('#confirm-file')

const cancelConfirm=
  document.querySelector('#cancel-confirm')

const acceptConfirm=
  document.querySelector('#accept-confirm')

const contextMenu=
  document.querySelector('#context-menu')

const editContext=
  document.querySelector('#edit-context')

const copyContext=
  document.querySelector('#copy-context')

const pasteContext=
  document.querySelector('#paste-context')

const duplicateContext=
  document.querySelector('#duplicate-context')

const deleteContext=
  document.querySelector('#delete-context')

const dataControl=
  document.querySelector('.data-control')

const dataButton=
  document.querySelector('.data-button')

const dataMenu=
  document.querySelector('.data-menu')

const exportData=
  document.querySelector('#export-data')

const importData=
  document.querySelector('#import-data')

let resolveModal
let modalMode='input'
let contextTarget


function cerrarModal(value=null){

  confirmModal.hidden=true
  confirmFile.value=''
  resolveModal?.(value)
  resolveModal=null
}


function pedirNombre(title,message,value=''){

  modalMode='input'
  confirmTitle.textContent=title
  confirmMessage.textContent=message
  confirmInput.value=value
  confirmInput.hidden=false
  confirmFile.hidden=true
  cancelConfirm.hidden=false
  acceptConfirm.textContent='Guardar'
  acceptConfirm.className='primary'
  confirmModal.hidden=false

  requestAnimationFrame(()=>{
    confirmInput.focus()
    confirmInput.select()
  })

  return new Promise(resolve=>{
    resolveModal=resolve
  })
}


function pedirConfirmacion(title,message){

  modalMode='confirm'
  confirmTitle.textContent=title
  confirmMessage.textContent=message
  confirmInput.value=''
  confirmInput.hidden=true
  confirmFile.hidden=true
  cancelConfirm.hidden=false
  acceptConfirm.textContent='Eliminar'
  acceptConfirm.className='danger'
  confirmModal.hidden=false

  requestAnimationFrame(()=>{
    acceptConfirm.focus()
  })

  return new Promise(resolve=>{
    resolveModal=resolve
  })
}


function pedirArchivo(){

  modalMode='file'
  confirmTitle.textContent='Importar datos'
  confirmMessage.textContent=
    'Selecciona un archivo JSON exportado desde este Kanban.'
  confirmInput.value=''
  confirmInput.hidden=true
  confirmFile.value=''
  confirmFile.hidden=false
  cancelConfirm.hidden=false
  acceptConfirm.textContent='Importar'
  acceptConfirm.className='primary'
  confirmModal.hidden=false

  requestAnimationFrame(()=>{
    confirmFile.focus()
  })

  return new Promise(resolve=>{
    resolveModal=resolve
  })
}


function mostrarMensaje(title,message){

  modalMode='message'
  confirmTitle.textContent=title
  confirmMessage.textContent=message
  confirmInput.hidden=true
  confirmFile.hidden=true
  cancelConfirm.hidden=true
  acceptConfirm.textContent='Aceptar'
  acceptConfirm.className='primary'
  confirmModal.hidden=false

  requestAnimationFrame(()=>{
    acceptConfirm.focus()
  })

  return new Promise(resolve=>{
    resolveModal=resolve
  })
}


function cerrarMenuContextual(){

  contextMenu.hidden=true
  contextTarget=null
}


async function copiarAlPortapapeles(text){

  try{
    await navigator.clipboard.writeText(text)
  }catch{
    let textarea=document.createElement('textarea')

    textarea.value=text
    textarea.style.position='fixed'
    textarea.style.opacity='0'
    document.body.append(textarea)
    textarea.select()
    document.execCommand('copy')
    textarea.remove()
  }
}


cancelConfirm.onclick=()=>cerrarModal()

acceptConfirm.onclick=()=>{

  if(modalMode==='file'){
    let file=confirmFile.files[0]

    if(!file)
      return

    cerrarModal(file)
    return
  }

  cerrarModal(
    modalMode==='confirm' ||
    modalMode==='message'
      ? true
      : confirmInput.value
  )
}

confirmModal.onclick=e=>{

  if(e.target===confirmModal)
    cerrarModal()
}

confirmInput.onkeydown=e=>{

  if(e.key==='Enter')
    cerrarModal(
      modalMode==='confirm'
        ? true
        : confirmInput.value
    )

  if(e.key==='Escape')
    cerrarModal()
}

const themeToggle=
  document.querySelector('[data-theme-toggle]')

const sunIcon=themeToggle.innerHTML
const moonIcon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><g fill="currentColor"><path d="M6 .278a.77.77 0 0 1 .08.858a7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316a.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71C0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"></path><path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"></path></g></svg>'

function aplicarTema(theme){

  document.documentElement.dataset.theme=theme

  let dark=theme==='dark'

  themeToggle.innerHTML=dark ? moonIcon : sunIcon
  themeToggle.title=`Modo ${dark ? 'Claro' : 'Oscuro'}`
}

aplicarTema(
  matchMedia('(prefers-color-scheme: dark)').matches
    ? 'dark'
    : 'light'
)

themeToggle.onclick=async()=>{

  let next=
    document.documentElement.dataset.theme==='dark'
      ? 'light'
      : 'dark'

  aplicarTema(next)
  await chrome.storage.local.set({
    [THEME_STORAGE]:next
  })
}

let drag
let dragImage
let dragImageOffset={x:0,y:0}
let columnMoveAnchor
let dragFrame
let pendingDragPoint
let pointerGesture
let workspaceDragMoved=false
let workspaceClickBlockedUntil=0
let selectedCards=new Set()
let selectionAnchor
let selectedColumns=new Set()
let columnSelectionAnchor
let draggedCards=[]
let draggedColumns=[]
let cardMoveTarget
let columnMoveTarget
let internalClipboard
let workspaces=[]
let activeWorkspace=''
let workspaceBoards=new Map()
let boardPreparationVersion=0
let saveQueue=Promise.resolve()
let saveTimer
let scheduledSavePromise
let resolveScheduledSave
let rejectScheduledSave


function moverDragImage(x,y){

  if(!dragImage)
    return

  dragImage.style.transform=
    `translate3d(${x-dragImageOffset.x}px,${y-dragImageOffset.y}px,0)`
}


function crearDragImage(element,e){

  let rect=element.getBoundingClientRect()

  dragImage?.remove()
  dragImage=element.cloneNode(true)
  dragImage.classList.remove('dragging')
  dragImage.classList.add('drag-image')
  dragImage.setAttribute('aria-hidden','true')
  dragImage.style.width=rect.width+'px'
  dragImage.style.height=rect.height+'px'

  dragImage
    .querySelectorAll('[draggable]')
    .forEach(item=>item.draggable=false)

  dragImage.draggable=false

  let selectionCount=
    draggedCards.length || draggedColumns.length

  if(selectionCount>1){
    let count=document.createElement('span')
    count.className='drag-selection-count'
    count.textContent=selectionCount
    dragImage.append(count)
  }

  dragImageOffset={
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  }

  document.body.append(dragImage)

  let sourceCards=
    element.querySelector?.('.cards')

  let previewCards=
    dragImage.querySelector?.('.cards')

  if(sourceCards && previewCards)
    previewCards.scrollTop=sourceCards.scrollTop

  moverDragImage(e.clientX,e.clientY)

  let transparent=
    document.createElement('canvas')

  transparent.width=1
  transparent.height=1

  if(e.dataTransfer){
    e.dataTransfer.effectAllowed='move'
    e.dataTransfer.setData('text/plain','')
    e.dataTransfer.setDragImage(transparent,0,0)
  }
}


function eliminarDragImage(){

  dragImage?.remove()
  dragImage=null
}


function limpiarSeleccion(){

  selectedCards.forEach(card=>card.classList.remove('selected'))
  selectedCards.clear()
  selectedColumns.forEach(column=>column.classList.remove('selected'))
  selectedColumns.clear()
  selectionAnchor=null
  columnSelectionAnchor=null
}


function seleccionarColumnas(columns,{anchor=true}={}){

  limpiarSeleccion()

  columns.forEach(column=>{
    selectedColumns.add(column)
    column.classList.add('selected')
  })

  if(anchor)
    columnSelectionAnchor=columns.at(-1) || null
}


function seleccionarColumna(column,e={}){

  let additive=e.ctrlKey || e.metaKey
  let ranged=e.shiftKey && columnSelectionAnchor?.isConnected

  if(ranged){
    let anchorColumn=columnSelectionAnchor
    let columns=[...kanban.querySelectorAll('.column')]
    let from=columns.indexOf(anchorColumn)
    let to=columns.indexOf(column)

    if(from!==-1 && to!==-1){
      let range=columns.slice(
        Math.min(from,to),
        Math.max(from,to)+1
      )

      if(!additive)
        limpiarSeleccion()

      range.forEach(item=>{
        selectedColumns.add(item)
        item.classList.add('selected')
      })
      columnSelectionAnchor=anchorColumn
      return
    }
  }

  if(additive){
    if(selectedColumns.has(column)){
      selectedColumns.delete(column)
      column.classList.remove('selected')
    }else{
      if(selectedCards.size)
        limpiarSeleccion()

      selectedColumns.add(column)
      column.classList.add('selected')
    }

    columnSelectionAnchor=column
    return
  }

  seleccionarColumnas([column])
}


function seleccionarTarjetas(cards,{anchor=true}={}){

  limpiarSeleccion()

  cards.forEach(card=>{
    selectedCards.add(card)
    card.classList.add('selected')
  })

  if(anchor)
    selectionAnchor=cards.at(-1) || null
}


function seleccionarTarjeta(card,e={}){

  let additive=e.ctrlKey || e.metaKey
  let ranged=e.shiftKey && selectionAnchor?.isConnected

  if(ranged){
    let anchorCard=selectionAnchor
    let cards=[...kanban.querySelectorAll('.card')]
    let from=cards.indexOf(selectionAnchor)
    let to=cards.indexOf(card)

    if(from!==-1 && to!==-1){
      let range=cards.slice(
        Math.min(from,to),
        Math.max(from,to)+1
      )

      if(!additive)
        limpiarSeleccion()

      range.forEach(item=>{
        selectedCards.add(item)
        item.classList.add('selected')
      })
      selectionAnchor=anchorCard
      return
    }
  }

  if(additive){
    if(selectedColumns.size)
      limpiarSeleccion()

    if(selectedCards.has(card)){
      selectedCards.delete(card)
      card.classList.remove('selected')
    }else{
      selectedCards.add(card)
      card.classList.add('selected')
    }

    selectionAnchor=card
    return
  }

  seleccionarTarjetas([card])
}


function ajustarColumnas(){

  let grid=
    view.value==='grid'

  kanban.classList.toggle(
    'row',
    !grid
  )

  document.querySelectorAll('.grid-setting')
    .forEach(setting=>setting.hidden=!grid)

  if(!grid)
    return

  let deseadas=Math.max(
    1,
    Number(columns.value) || 1
  )

  let minimo=Math.max(
    100,
    Number(minWidth.value) || 100
  )

  let gap=15

  let ancho=
    kanban.clientWidth - 40

  let caben=Math.max(
    1,
    Math.floor(
      (ancho + gap) /
      (minimo + gap)
    )
  )

  let reales=Math.min(
    deseadas,
    caben
  )

  document.documentElement.style
    .setProperty(
      '--real-columns',
      reales
    )
}


function leerConfiguracion(){

  return {
    columns:columns.value,
    height:height.value,
    minWidth:minWidth.value,
    view:view.value
  }
}


function normalizarConfiguracion(settings={}){

  return {
    columns:String(settings.columns || DEFAULT_SETTINGS.columns),
    height:String(settings.height || DEFAULT_SETTINGS.height),
    minWidth:String(settings.minWidth || DEFAULT_SETTINGS.minWidth),
    view:settings.view==='row' ? 'row' : 'grid'
  }
}


function aplicarConfiguracion(settings){

  let config=normalizarConfiguracion(settings)

  columns.value=config.columns
  height.value=config.height
  minWidth.value=config.minWidth
  view.value=config.view

  document.documentElement.style
    .setProperty(
      '--height',
      height.value+'px'
    )

  ajustarColumnas()
}


function leerTablero(){

  return [
    ...kanban.querySelectorAll('.column')
  ].map(column=>({

    title:
      column.querySelector('h3').innerHTML,

    cards:[
      ...column.querySelectorAll('.card')
    ].map(card=>card.innerHTML)
  }))
}


function crearTarjeta(content='Nueva tarjeta'){

  let card=document.createElement('div')

  card.className='card'
  card.draggable=true
  card.innerHTML=content

  return card
}


function crearColumna(item={}){

  let column=
    document.createElement('section')

  column.className='column'

  column.innerHTML=`
    <div class="column-header">
      <h3 draggable="true"></h3>
      <span class="column-count"></span>
    </div>
    <div class="cards"></div>
    <button class="add-card">
      + Agregar tarjeta
    </button>
  `

  column.querySelector('h3')
    .innerHTML=item.title || 'Nueva columna'

  let cards=
    column.querySelector('.cards')

  ;(item.cards || []).forEach(text=>{
    cards.append(crearTarjeta(text))
  })

  column.querySelector('.column-count').textContent=
    cards.querySelectorAll('.card').length

  return column
}


function actualizarContadoresColumnas(){

  kanban.querySelectorAll('.column').forEach(column=>{
    column.querySelector('.column-count').textContent=
      column.querySelectorAll('.card').length
  })
}


function prepararTablero(workspace){

  if(workspaceBoards.has(workspace.id))
    return workspaceBoards.get(workspace.id)

  let nodes=(workspace.board || []).map(crearColumna)

  workspaceBoards.set(workspace.id,nodes)
  return nodes
}


function dibujarTablero(board,id=activeWorkspace){

  let nodes=(board || []).map(crearColumna)

  limpiarSeleccion()
  workspaceBoards.set(id,nodes)
  kanban.replaceChildren(...nodes)
}


function mostrarTablero(id,{preservarActual=true}={}){

  if(preservarActual && activeWorkspace)
    workspaceBoards.set(
      activeWorkspace,
      [...kanban.children]
    )

  let workspace=workspaces.find(item=>item.id===id)

  if(!workspace)
    return null

  limpiarSeleccion()
  activeWorkspace=id
  kanban.replaceChildren(...prepararTablero(workspace))

  return workspace
}


function prepararTablerosRestantes(){

  let version=++boardPreparationVersion
  let activeIndex=workspaces.findIndex(
    workspace=>workspace.id===activeWorkspace
  )
  let pending=[
    ...workspaces.slice(activeIndex+1),
    ...workspaces.slice(0,Math.max(activeIndex,0))
  ].filter(workspace=>!workspaceBoards.has(workspace.id))

  let schedule=window.requestIdleCallback ||
    (callback=>setTimeout(
      ()=>callback({didTimeout:false,timeRemaining:()=>8}),
      0
    ))

  let prepareNext=()=>{

    if(
      version!==boardPreparationVersion ||
      !pending.length
    )
      return

    prepararTablero(pending.shift())
    schedule(prepareNext,{timeout:80})
  }

  if(pending.length)
    schedule(prepareNext,{timeout:80})
}


function dibujarWorkspaces(){

  workspaceTabs.replaceChildren(
    ...workspaces.map(workspace=>{

      let button=
        document.createElement('button')

      let name=
        document.createElement('span')

      let count=
        document.createElement('span')

      button.className=
        'workspace-tab' +
        (workspace.id===activeWorkspace
          ? ' active'
          : '')

      button.dataset.workspace=workspace.id
      button.type='button'
      button.draggable=true

      name.textContent=workspace.title
      count.className='workspace-count'
      count.textContent=(workspace.board || [])
        .reduce(
          (total,column)=>
            total+(column.cards || []).length,
          0
        )

      button.append(name,count)

      return button
    })
  )

  asegurarWorkspaceVisible()
}


function asegurarWorkspaceVisible(){

  requestAnimationFrame(()=>{

    let activeTab=
      workspaceTabs.querySelector(
        '.workspace-tab.active'
      )

    if(!activeTab)
      return

    let tabsRect=
      workspaceTabs.getBoundingClientRect()

    let activeRect=
      activeTab.getBoundingClientRect()

    if(activeRect.left < tabsRect.left)
      workspaceTabs.scrollLeft-=
        tabsRect.left-activeRect.left

    if(activeRect.right > tabsRect.right)
      workspaceTabs.scrollLeft+=
        activeRect.right-tabsRect.right
  })
}


function sincronizarWorkspaces(){

  let tabs=[
    ...workspaceTabs.querySelectorAll('.workspace-tab')
  ]

  if(
    tabs.length!==workspaces.length ||
    tabs.some(
      (tab,index)=>
        tab.dataset.workspace!==workspaces[index]?.id
    )
  ){
    dibujarWorkspaces()
    return
  }

  let activeChanged=false

  tabs.forEach((tab,index)=>{

    let workspace=workspaces[index]
    let active=workspace.id===activeWorkspace

    if(tab.classList.contains('active')!==active)
      activeChanged=true

    tab.classList.toggle('active',active)
    tab.querySelector('span').textContent=workspace.title
    tab.querySelector('.workspace-count').textContent=
      (workspace.board || []).reduce(
        (total,column)=>
          total+(column.cards || []).length,
        0
      )
  })

  if(activeChanged)
    asegurarWorkspaceVisible()
}


function escribirDatos(){

  let data=structuredClone({
    activeWorkspace,
    workspaces
  })

  saveQueue=saveQueue
    .catch(()=>{})
    .then(()=>chrome.storage.local.set({
      [STORAGE]:data
    }))

  return saveQueue
}


function ejecutarGuardadoProgramado(){

  if(saveTimer){
    clearTimeout(saveTimer)
    saveTimer=null
  }

  let resolve=resolveScheduledSave
  let reject=rejectScheduledSave

  scheduledSavePromise=null
  resolveScheduledSave=null
  rejectScheduledSave=null

  let task=escribirDatos()

  task.then(resolve,reject)
  return task
}


function programarGuardado(){

  if(!scheduledSavePromise)
    scheduledSavePromise=new Promise((resolve,reject)=>{
      resolveScheduledSave=resolve
      rejectScheduledSave=reject
    })

  clearTimeout(saveTimer)
  saveTimer=setTimeout(
    ejecutarGuardadoProgramado,
    30
  )

  return scheduledSavePromise
}


function guardar({
  inmediato=false,
  tablero=true,
  configuracion=true
}={}){

  let current=
    workspaces.find(
      workspace=>workspace.id===activeWorkspace
    )

  if(current){
    if(tablero){
      actualizarContadoresColumnas()
      current.board=leerTablero()
    }

    if(configuracion)
      current.settings=leerConfiguracion()
  }

  sincronizarWorkspaces()

  return inmediato
    ? ejecutarGuardadoProgramado()
    : programarGuardado()
}


async function exportarDatos(){

  await guardar({inmediato:true})

  let data=JSON.stringify({
    version:1,
    activeWorkspace,
    workspaces
  },null,2)

  let blob=new Blob(
    [data],
    {type:'application/json'}
  )

  let url=URL.createObjectURL(blob)
  let link=document.createElement('a')
  let now=new Date()
  let localDate=[
    now.getFullYear(),
    String(now.getMonth()+1).padStart(2,'0'),
    String(now.getDate()).padStart(2,'0')
  ].join('-')

  link.href=url
  link.download=
    `kanban-${localDate}.json`

  document.body.append(link)
  link.click()
  link.remove()
  URL.revokeObjectURL(url)
}


async function importarDatos(data){

  if(
    !data ||
    !Array.isArray(data.workspaces) ||
    !data.workspaces.length
  )
    throw new Error('Formato invalido')

  let legacySettings={
    columns:data.columns,
    height:data.height,
    minWidth:data.minWidth,
    view:data.view
  }

  workspaces=data.workspaces.map((workspace,index)=>({
    id:String(workspace?.id || `workspace-${index+1}`),
    title:String(workspace?.title || `Tablero ${index+1}`),
    board:Array.isArray(workspace?.board)
      ? workspace.board
          .filter(column=>column && typeof column==='object')
          .map((column,columnIndex)=>({
            title:String(
              column.title ||
              `Nueva columna ${columnIndex+1}`
            ),
            cards:Array.isArray(column.cards)
              ? column.cards.map(card=>String(card))
              : []
          }))
      : [],
    settings:normalizarConfiguracion(
      workspace?.settings || legacySettings
    )
  }))

  activeWorkspace=workspaces.some(
    workspace=>workspace.id===String(data.activeWorkspace)
  )
    ? String(data.activeWorkspace)
    : workspaces[0].id

  let current=workspaces.find(
    workspace=>workspace.id===activeWorkspace
  )

  workspaceBoards.clear()
  boardPreparationVersion++
  dibujarTablero(current.board,current.id)
  aplicarConfiguracion(current.settings)
  dibujarWorkspaces()
  prepararTablerosRestantes()
  await guardar({inmediato:true})
}


async function cargar(){

  let initialBoard=
    leerTablero()

  let stored=
    await chrome.storage.local.get([
      STORAGE,
      THEME_STORAGE
    ])

  let data=
    stored[STORAGE] || {}

  let storedTheme=
    stored[THEME_STORAGE]

  if(
    storedTheme==='dark' ||
    storedTheme==='light'
  )
    aplicarTema(storedTheme)


  let legacySettings={
    columns:data.columns,
    height:data.height,
    minWidth:data.minWidth,
    view:data.view
  }


  workspaces=Array.isArray(data.workspaces) &&
    data.workspaces.length
      ? data.workspaces.map((workspace,index)=>({
          id:String(workspace.id || `workspace-${index+1}`),
          title:String(workspace.title || `Tablero ${index+1}`),
          board:Array.isArray(workspace.board)
            ? workspace.board
            : [],
          settings:normalizarConfiguracion(
            workspace.settings || legacySettings
          )
        }))
      : [{
          id:'workspace-1',
          title:'Tablero 1',
          board:Array.isArray(data.board)
            ? data.board
            : initialBoard,
          settings:normalizarConfiguracion(legacySettings)
        }]

  activeWorkspace=workspaces.some(
    workspace=>workspace.id===data.activeWorkspace
  )
    ? data.activeWorkspace
    : workspaces[0].id

  let current=workspaces.find(
    workspace=>workspace.id===activeWorkspace
  )

  workspaceBoards.clear()
  boardPreparationVersion++
  dibujarTablero(current.board,current.id)
  aplicarConfiguracion(current.settings)
  dibujarWorkspaces()
  prepararTablerosRestantes()
  await guardar({inmediato:true})
}


function editar(el,seleccionar=false){

  el.contentEditable=true
  el.draggable=false
  el.focus({preventScroll:true})

  let range=
    document.createRange()

  range.selectNodeContents(el)

  if(!seleccionar)
    range.collapse(false)

  let selection=
    window.getSelection()

  selection.removeAllRanges()
  selection.addRange(range)
}

document.addEventListener(
  'contextmenu',
  e=>{

    let workspaceTab=
      e.target.closest('.workspace-tab')

    let card=e.target.closest('.card')
    let column=e.target.closest('.column')

    if(
      workspaceTab &&
      workspaceTabs.contains(workspaceTab)
    ){
      e.preventDefault()
      contextTarget=workspaceTab
      editContext.hidden=false
      copyContext.hidden=true
      pasteContext.hidden=true
      duplicateContext.hidden=true
      deleteContext.hidden=false
      deleteContext.textContent='Eliminar tablero'
    }else if(
      column &&
      kanban.contains(column)
    ){
      e.preventDefault()
      contextTarget=card || column
      editContext.hidden=true
      copyContext.hidden=false
      pasteContext.hidden=internalClipboard?.type!=='card'
      duplicateContext.hidden=false
      deleteContext.hidden=false

      if(card && !selectedCards.has(card))
        seleccionarTarjetas([card])

      if(!card && !selectedColumns.has(column))
        seleccionarColumnas([column])

      deleteContext.textContent=
        card
          ? selectedCards.has(card) && selectedCards.size>1
            ? `Eliminar ${selectedCards.size} tarjetas`
            : 'Eliminar tarjeta'
          : selectedColumns.has(column) && selectedColumns.size>1
            ? `Eliminar ${selectedColumns.size} columnas`
            : 'Eliminar columna'
    }else if(
      kanban.contains(e.target) &&
      internalClipboard?.type==='column'
    ){
      e.preventDefault()
      contextTarget=kanban
      editContext.hidden=true
      copyContext.hidden=true
      pasteContext.hidden=false
      duplicateContext.hidden=true
      deleteContext.hidden=true
    }else{
      cerrarMenuContextual()
      return
    }

    contextMenu.hidden=false

    let rect=contextMenu.getBoundingClientRect()

    contextMenu.style.left=
      Math.max(
        6,
        Math.min(e.clientX,innerWidth-rect.width-6)
      )+'px'

    contextMenu.style.top=
      Math.max(
        6,
        Math.min(e.clientY,innerHeight-rect.height-6)
      )+'px'
  }
)


editContext.onclick=async()=>{

  let target=contextTarget
  cerrarMenuContextual()

  if(!target?.matches('.workspace-tab'))
    return

  let workspace=workspaces.find(
    item=>item.id===target.dataset.workspace
  )

  if(!workspace)
    return

  let title=await pedirNombre(
    'Renombrar tablero',
    'Escribe el nuevo nombre del tablero.',
    workspace.title
  )

  if(!title?.trim())
    return

  workspace.title=title.trim()
  guardar({tablero:false,configuracion:false})
}


copyContext.onclick=async()=>{

  let target=contextTarget
  cerrarMenuContextual()

  if(!target || target.matches('.workspace-tab'))
    return

  let text

  if(target.matches('.card')){
    let cards=selectedCards.has(target)
      ? [...kanban.querySelectorAll('.card')]
          .filter(card=>selectedCards.has(card))
      : [target]

    internalClipboard={
      type:'card',
      items:cards.map(card=>card.innerHTML)
    }
    text=cards.map(card=>card.textContent.trim()).join('\n')
  }else{
    let columns=selectedColumns.has(target)
      ? [...kanban.querySelectorAll('.column')]
          .filter(column=>selectedColumns.has(column))
      : [target]
    let items=columns.map(column=>({
      title:column.querySelector('h3').innerHTML,
      cards:[...column.querySelectorAll('.card')]
        .map(card=>card.innerHTML)
    }))

    internalClipboard={type:'column',items}
    text=columns.map(column=>[
      column.querySelector('h3')?.textContent.trim(),
      ...[...column.querySelectorAll('.card')]
        .map(card=>card.textContent.trim())
    ].filter(Boolean).join('\n')).join('\n\n')
  }

  await copiarAlPortapapeles(text)
}


pasteContext.onclick=()=>{

  let target=contextTarget
  let clipboard=internalClipboard
  cerrarMenuContextual()

  if(!target || !clipboard)
    return

  if(
    clipboard.type==='column' &&
    target===kanban
  ){
    let columns=clipboard.items.map(item=>
      crearColumna(structuredClone(item))
    )

    kanban.append(...columns)
    seleccionarColumnas(columns)
    ajustarColumnas()
    guardar()
    return
  }

  if(clipboard.type!=='card')
    return

  let column=target.closest('.column')

  if(!column)
    return

  let cards=clipboard.items.map(crearTarjeta)
  let reference=target.matches('.card')
    ? target.nextSibling
    : null
  let container=column.querySelector('.cards')

  cards.forEach(card=>container.insertBefore(card,reference))
  seleccionarTarjetas(cards)
  guardar()
}


duplicateContext.onclick=()=>{

  let target=contextTarget
  cerrarMenuContextual()

  if(!target || target.matches('.workspace-tab'))
    return

  let duplicate=target.cloneNode(true)
  let card=target.matches('.card')

  duplicate.classList.remove('dragging','selected')
  duplicate.contentEditable=false
  duplicate.draggable=card

  duplicate.querySelectorAll('.card,h3')
    .forEach(item=>{
      item.classList.remove('dragging','selected')
      item.contentEditable=false
      item.draggable=true
    })

  target.after(duplicate)

  if(card)
    seleccionarTarjetas([duplicate])
  else
    seleccionarColumna(duplicate)

  ajustarColumnas()
  guardar()
}


deleteContext.onclick=async()=>{

  let target=contextTarget
  let card=target?.matches('.card')
  let workspace=target?.matches('.workspace-tab')
  let column=target?.matches('.column')
  let cardTargets=card && selectedCards.has(target)
    ? [...kanban.querySelectorAll('.card')]
        .filter(item=>selectedCards.has(item))
    : card
      ? [target]
      : []
  let columnTargets=column && selectedColumns.has(target)
    ? [...kanban.querySelectorAll('.column')]
        .filter(item=>selectedColumns.has(item))
    : column
      ? [target]
      : []
  let multipleCards=cardTargets.length>1
  let multipleColumns=columnTargets.length>1
  let type=workspace
    ? 'tablero'
    : card
      ? multipleCards
        ? 'tarjetas'
        : 'tarjeta'
      : multipleColumns
        ? 'columnas'
        : 'columna'

  let label=workspace
    ? target.querySelector('span')
        ?.textContent.trim()
    : card
      ? multipleCards
        ? `${cardTargets.length} tarjetas seleccionadas`
        : target.textContent.trim()
      : multipleColumns
        ? `${columnTargets.length} columnas seleccionadas`
        : target?.querySelector('h3')
            ?.textContent.trim()

  cerrarMenuContextual()

  if(!target)
    return

  let accepted=await pedirConfirmacion(
    `Eliminar ${type}`,
    multipleCards || multipleColumns
      ? `Vas a eliminar ${label}. Esta accion no se puede deshacer.`
      : `Vas a eliminar ${type==='tablero' ? 'el' : 'la'} ${type} "${label || ''}". Esta accion no se puede deshacer.`
  )

  if(
    !accepted ||
    (card
      ? !cardTargets.some(item=>item.isConnected)
      : column
        ? !columnTargets.some(item=>item.isConnected)
        : !target.isConnected)
  )
    return

  if(workspace){
    let id=target.dataset.workspace
    let deletingActive=id===activeWorkspace
    let index=workspaces.findIndex(
      item=>item.id===id
    )

    workspaces=workspaces.filter(
      item=>item.id!==id
    )
    workspaceBoards.delete(id)

    if(!workspaces.length)
      workspaces.push({
        id:crypto.randomUUID?.() ||
          `workspace-${Date.now()}`,
        title:'Tablero 1',
        board:[{
          title:'Nueva columna 1',
          cards:[]
        }],
        settings:normalizarConfiguracion()
      })

    if(deletingActive){
      let next=workspaces[
        Math.min(
          Math.max(index,0),
          workspaces.length-1
        )
      ]

      mostrarTablero(
        next.id,
        {preservarActual:false}
      )
      aplicarConfiguracion(next.settings)
    }else{
      ajustarColumnas()
    }

    prepararTablerosRestantes()
    guardar()
    return
  }

  if(card){
    cardTargets.forEach(item=>item.remove())
    limpiarSeleccion()
    guardar()
    return
  }

  columnTargets.forEach(item=>item.remove())
  limpiarSeleccion()
  ajustarColumnas()
  guardar()
}

function obtenerOrigenArrastre(target){

  let workspaceTab=target.closest?.('.workspace-tab')

  if(
    workspaceTab &&
    workspaceTabs.contains(workspaceTab)
  )
    return {element:workspaceTab,handle:workspaceTab}

  let card=target.closest?.('.card')

  if(card && kanban.contains(card))
    return {element:card,handle:card}

  let heading=target.closest?.('h3')

  if(heading && kanban.contains(heading))
    return {
      element:heading.closest('.column'),
      handle:heading
    }

  return null
}


function iniciarArrastre(element,e){

  if(drag)
    return false

  if(document.activeElement?.isContentEditable)
    document.activeElement.blur()

  drag=element
  columnMoveAnchor=null
  columnMoveTarget=null
  cardMoveTarget=null
  workspaceDragMoved=false

  if(drag.matches('.card')){
    if(!selectedCards.has(drag))
      seleccionarTarjetas([drag])

    draggedCards=[...kanban.querySelectorAll('.card')]
      .filter(card=>selectedCards.has(card))
  }else{
    draggedCards=[]

    if(drag.matches('.column')){
      if(!selectedColumns.has(drag))
        seleccionarColumnas([drag])

      draggedColumns=[...kanban.querySelectorAll('.column')]
        .filter(column=>selectedColumns.has(column))
    }else{
      draggedColumns=[]
    }
  }

  document.documentElement.classList.add('is-dragging')
  crearDragImage(drag,e)

  ;(draggedCards.length
      ? draggedCards
      : draggedColumns.length
        ? draggedColumns
        : [drag])
    .forEach(item=>item.classList.add('dragging'))

  return true
}


function programarArrastre(target,x,y){

  pendingDragPoint={target,x,y}

  if(dragFrame)
    return

  dragFrame=requestAnimationFrame(()=>{
    dragFrame=null

    let point=pendingDragPoint
    pendingDragPoint=null

    if(point)
      procesarArrastre(
        point.target,
        point.x,
        point.y
      )
  })
}


function finalizarArrastre(){

  if(!drag)
    return

    if(dragFrame){
      cancelAnimationFrame(dragFrame)
      dragFrame=null
    }

    if(pendingDragPoint){
      let point=pendingDragPoint
      pendingDragPoint=null
      procesarArrastre(
        point.target,
        point.x,
        point.y
      )
    }

    let completedDrag=drag

    if(completedDrag?.matches('.workspace-tab')){
      let byId=new Map(
        workspaces.map(workspace=>[workspace.id,workspace])
      )

      workspaces=[
        ...workspaceTabs.querySelectorAll('.workspace-tab')
      ].map(tab=>byId.get(tab.dataset.workspace))
        .filter(Boolean)

      if(workspaceDragMoved)
        workspaceClickBlockedUntil=performance.now()+200
    }

    ;(draggedCards.length
        ? draggedCards
        : draggedColumns.length
          ? draggedColumns
          : [drag])
      .forEach(item=>item?.classList.remove('dragging'))
    document.documentElement.classList.remove('is-dragging')
    eliminarDragImage()

    drag=null
    draggedCards=[]
    draggedColumns=[]
    cardMoveTarget=null
    columnMoveTarget=null
    columnMoveAnchor=null

    if(completedDrag?.matches('.workspace-tab'))
      guardar({tablero:false,configuracion:false})
    else
      guardar()
}


document.addEventListener(
  'dragstart',
  e=>{

    let origin=obtenerOrigenArrastre(e.target)

    if(origin)
      iniciarArrastre(origin.element,e)
  }
)


document.addEventListener(
  'drag',
  e=>{

    if(
      dragImage &&
      (e.clientX || e.clientY)
    )
      moverDragImage(e.clientX,e.clientY)
  }
)


document.addEventListener(
  'dragend',
  finalizarArrastre
)


function procesarArrastre(eventTarget,clientX,clientY){

  if(!drag)
    return

  if(drag.matches('.workspace-tab')){

    if(!workspaceTabs.contains(eventTarget))
      return

    let next=[
      ...workspaceTabs.querySelectorAll(
        '.workspace-tab:not(.dragging)'
      )
    ].find(tab=>{
      let rect=tab.getBoundingClientRect()
      return clientX < rect.left + rect.width/2
    })

    if(drag.nextElementSibling===(next || null))
      return

    workspaceTabs.insertBefore(drag,next || null)
    workspaceDragMoved=true
    return
  }

  if(drag.matches('.card')){

      let column=
        eventTarget.closest('.column')

      if(!column)
        return

      let cards=
        column.querySelector('.cards')

      let next=[
        ...cards.querySelectorAll(
          '.card:not(.dragging)'
        )
      ].find(card=>{

        let rect=
          card.getBoundingClientRect()

        return clientY <
          rect.top +
          rect.height/2
      })

      if(
        cardMoveTarget?.cards!==cards ||
        cardMoveTarget?.next!==next
      ){
        if(draggedCards.length===1){
          cards.insertBefore(draggedCards[0],next || null)
        }else{
          let fragment=document.createDocumentFragment()

          draggedCards.forEach(card=>fragment.append(card))
          cards.insertBefore(fragment,next || null)
        }

        cardMoveTarget={cards,next}
        actualizarContadoresColumnas()
      }

      return
  }


  if(drag.matches('.column')){

      if(
        columnMoveAnchor &&
        Math.hypot(
          clientX-columnMoveAnchor.x,
          clientY-columnMoveAnchor.y
        ) < COLUMN_MOVE_MARGIN
      )
        return

      let hovered=
        eventTarget.closest('.column')

      if(hovered?.classList.contains('dragging'))
        return

      let candidates=[
        ...kanban.querySelectorAll(
          '.column:not(.dragging)'
        )
      ]

      if(!candidates.length){
        return
      }

      let target=hovered ||
        candidates.reduce(
          (nearest,column)=>{

            let rect=
              column.getBoundingClientRect()

            let dx=
              clientX < rect.left
                ? rect.left-clientX
                : clientX > rect.right
                  ? clientX-rect.right
                  : 0

            let dy=
              clientY < rect.top
                ? rect.top-clientY
                : clientY > rect.bottom
                  ? clientY-rect.bottom
                  : 0

            let distance=
              dx*dx + dy*dy

            return !nearest ||
              distance < nearest.distance
                ? {column,distance}
                : nearest
          },
          null
        ).column

      if(columnMoveTarget===target)
        return

      let ordered=[
        ...kanban.querySelectorAll('.column')
      ]
      let firstDraggedIndex=Math.min(
        ...draggedColumns.map(column=>ordered.indexOf(column))
      )
      let targetIndex=ordered.indexOf(target)
      let fragment=document.createDocumentFragment()

      draggedColumns.forEach(column=>fragment.append(column))

      if(firstDraggedIndex < targetIndex)
        target.after(fragment)
      else
        target.before(fragment)

      columnMoveTarget=target
      columnMoveAnchor={
        x:clientX,
        y:clientY
      }
  }
}


document.addEventListener(
  'dragover',
  e=>{

    e.preventDefault()

    if(dragImage)
      moverDragImage(e.clientX,e.clientY)

    if(!drag)
      return

    programarArrastre(
      e.target,
      e.clientX,
      e.clientY
    )
  }
)


document.addEventListener(
  'pointerdown',
  e=>{

    if(
      e.button!==0 ||
      pointerGesture ||
      e.target.closest?.('[contenteditable="true"]')
    )
      return

    let origin=obtenerOrigenArrastre(e.target)

    if(!origin){
      if(!e.target.closest?.('.context-menu,.modal-backdrop'))
        limpiarSeleccion()
      return
    }

    let collapseOnClick=false

    if(origin.element.matches('.card')){
      collapseOnClick=
        !e.ctrlKey &&
        !e.metaKey &&
        !e.shiftKey &&
        selectedCards.has(origin.element) &&
        selectedCards.size>1

      if(!collapseOnClick)
        seleccionarTarjeta(origin.element,e)
    }else if(origin.element.matches('.column')){
      collapseOnClick=
        !e.ctrlKey &&
        !e.metaKey &&
        !e.shiftKey &&
        selectedColumns.has(origin.element) &&
        selectedColumns.size>1

      if(!collapseOnClick)
        seleccionarColumna(origin.element,e)
    }else{
      limpiarSeleccion()
    }

    pointerGesture={
      pointerId:e.pointerId,
      origin,
      x:e.clientX,
      y:e.clientY,
      started:false,
      collapseOnClick,
      draggable:origin.handle.draggable
    }

    origin.handle.draggable=false
    origin.handle.setPointerCapture?.(e.pointerId)
    document.documentElement.classList.add('is-dragging')
  }
)


document.addEventListener(
  'pointermove',
  e=>{

    let gesture=pointerGesture

    if(
      !gesture ||
      gesture.pointerId!==e.pointerId
    )
      return

    if(!gesture.started){
      if(
        Math.hypot(
          e.clientX-gesture.x,
          e.clientY-gesture.y
        ) < 5
      )
        return

      gesture.started=iniciarArrastre(
        gesture.origin.element,
        e
      )

      if(!gesture.started)
        return
    }

    e.preventDefault()
    moverDragImage(e.clientX,e.clientY)

    let target=document.elementFromPoint(
      e.clientX,
      e.clientY
    ) || e.target

    programarArrastre(
      target,
      e.clientX,
      e.clientY
    )
  },
  {passive:false}
)


function terminarGestoPuntero(e){

  let gesture=pointerGesture

  if(
    !gesture ||
    gesture.pointerId!==e.pointerId
  )
    return

  pointerGesture=null
  gesture.origin.handle.draggable=gesture.draggable

  if(!gesture.started){
    document.documentElement.classList.remove('is-dragging')

    if(gesture.collapseOnClick)
      if(gesture.origin.element.matches('.card'))
        seleccionarTarjetas([gesture.origin.element])
      else
        seleccionarColumnas([gesture.origin.element])

    return
  }

  e.preventDefault()

  if(e.type!=='pointercancel'){
    let target=document.elementFromPoint(
      e.clientX,
      e.clientY
    ) || e.target

    pendingDragPoint={
      target,
      x:e.clientX,
      y:e.clientY
    }
  }

  finalizarArrastre()
}


document.addEventListener(
  'pointerup',
  terminarGestoPuntero
)


document.addEventListener(
  'pointercancel',
  terminarGestoPuntero
)


document.addEventListener(
  'dblclick',
  e=>{

    if(
      !e.target.matches('.card,h3')
    )
      return

    editar(e.target)
  }
)


document.addEventListener(
  'keydown',
  e=>{

    if(
      !e.target.isContentEditable
    )
      return


    if(
      e.key==='Enter' &&
      e.shiftKey
    ){

      if(e.target.matches('h3')){

        e.preventDefault()
        e.target.blur()
      }

      return
    }


    if(e.key==='Enter'){

      e.preventDefault()
      e.target.blur()
    }
  }
)


document.addEventListener(
  'blur',
  e=>{

    if(
      !e.target.isContentEditable
    )
      return

    e.target.contentEditable=false
    e.target.draggable=true

    guardar()
  },
  true
)


document.addEventListener(
  'click',
  e=>{

    if(
      !e.target.matches('.add-card')
    )
      return

    let cards=
      e.target
        .closest('.column')
        .querySelector('.cards')

    let card=crearTarjeta(
      `Nueva tarjeta ${cards.querySelectorAll('.card').length+1}`
    )

    cards.append(card)

    cards.scrollTop=
      cards.scrollHeight

    guardar()

    editar(
      card,
      true
    )
  }
)


workspaceTabs.addEventListener(
  'click',
  e=>{

    if(performance.now() < workspaceClickBlockedUntil){
      e.preventDefault()
      return
    }

    let tab=
      e.target.closest('.workspace-tab')

    if(
      !tab ||
      tab.dataset.workspace===activeWorkspace
    )
      return

    guardar()

    let workspace=mostrarTablero(
      tab.dataset.workspace
    )

    aplicarConfiguracion(workspace.settings)
    prepararTablerosRestantes()
    guardar()
  }
)


workspaceTabs.addEventListener(
  'wheel',
  e=>{

    if(
      workspaceTabs.scrollWidth <=
      workspaceTabs.clientWidth
    )
      return

    e.preventDefault()
    workspaceTabs.scrollLeft+=
      e.deltaY || e.deltaX
  },
  {passive:false}
)

  dataMenu.hidden=!dataMenu.hidden
}

  dataMenu.hidden=true
  await exportarDatos()
}


importData.onclick=async()=>{

  dataMenu.hidden=true

  let file=await pedirArchivo()

  if(!file)
    return

  try{
    let data=JSON.parse(await file.text())
    await importarDatos(data)
  }catch{
    await mostrarMensaje(
      'No se pudo importar',
      'El archivo seleccionado no contiene datos válidos del Kanban.'
    )
  }
}

    if(!dataControl.contains(e.target))

  }
)

.onclick=async()=>{

  let suggested=
    `Tablero ${workspaces.length+1}`

  let title=await pedirNombre(
    'Agregar tablero',
    'Escribe el nombre del nuevo tablero.',
    suggested
  )

  if(title===null)
    return

  guardar()

  let id=
    crypto.randomUUID?.() ||
    `workspace-${Date.now()}`

  workspaces.push({
    id,
    title:title.trim() || suggested,
    board:[{
      title:'Nueva columna 1',
      cards:[]
    }],
    settings:normalizarConfiguracion()
  })

  let workspace=mostrarTablero(id)

  aplicarConfiguracion(
    workspace.settings
  )
  prepararTablerosRestantes()
  guardar()
}

  let column=crearColumna({

  kanban.append(column)

  ajustarColumnas()
  guardar()

  editar(

    true
  )
}
