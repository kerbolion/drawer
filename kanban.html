<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>

<style>
*{box-sizing:border-box}

:root{
  --real-columns:3;
  --height:600px;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

.settings{
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  align-items:center;
  padding:12px 20px;
  background:white;
  border-bottom:1px solid #ddd;
}

.settings label{
  display:flex;
  align-items:center;
  gap:6px;
}

.settings input{
  width:75px;
  padding:5px;
}

.settings select{
  padding:5px;
}

button{
  border:0;
  cursor:pointer;
}

.add-column{
  padding:8px 12px;
}

.kanban{
  display:grid;
  grid-template-columns:repeat(var(--real-columns),minmax(0,1fr));
  gap:15px;
  padding:20px;
  width:100%;
  align-items:start;
}

.kanban.row{
  grid-auto-flow:column;
  grid-auto-columns:minmax(300px,320px);
  grid-template-columns:none;
  overflow-x:auto;
}

.kanban.row .column{
  height:600px;
}

.column{
  background:#e9e9e9;
  width:100%;
  min-width:0;
  height:var(--height);
  padding:10px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
}

.column h3{
  margin:0 0 10px;
  padding:5px;
  cursor:grab;
  flex:none;
}

.cards{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding: 10px;
}

.card{
  background:white;
  padding:12px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:grab;
  box-shadow:0 1px 3px #0002;
}

.add-card{
  flex:none;
  width:100%;
  padding:8px;
  background:transparent;
  text-align:left;
}

.dragging{
  opacity:.35;
}

[contenteditable="true"]{
  cursor:text;
  outline:2px solid #999;
  background:white;
}
</style>
</head>

<body>

<div class="settings">

  <label>
    Mostrar como
    <select id="view">
      <option value="grid">GRID</option>
      <option value="row">FILA</option>
    </select>
  </label>

  <label class="grid-setting">
    Columnas por fila
    <input
      id="columns"
      type="number"
      min="1"
      max="20"
      value="3">
  </label>

  <label class="grid-setting">
    Alto
    <input
      id="height"
      type="number"
      min="150"
      value="600">
    px
  </label>

  <label class="grid-setting">
    Ancho mínimo
    <input
      id="minWidth"
      type="number"
      min="100"
      value="280">
    px
  </label>

  <button class="add-column">
    + Agregar columna
  </button>

</div>


<div class="kanban" id="kanban">

  <section class="column">

    <h3 draggable="true">Pendiente</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear landing</div>
      <div class="card" draggable="true">Diseñar formulario</div>
      <div class="card" draggable="true">Configurar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">En proceso</h3>

    <div class="cards">
      <div class="card" draggable="true">Crear CRM</div>
      <div class="card" draggable="true">Probar extensión</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>


  <section class="column">

    <h3 draggable="true">Terminado</h3>

    <div class="cards">
      <div class="card" draggable="true">Comprar dominio</div>
    </div>

    <button class="add-card">
      + Agregar tarjeta
    </button>

  </section>

</div>


<script>
const STORAGE='kanban-data'

let drag


function ajustarColumnas(){

  let grid=
    view.value==='grid'

  kanban.classList.toggle(
    'row',
    !grid
  )

  document.querySelectorAll('.grid-setting')
    .forEach(setting=>setting.hidden=!grid)

  if(!grid)
    return

  let deseadas=Math.max(
    1,
    Number(columns.value) || 1
  )

  let minimo=Math.max(
    100,
    Number(minWidth.value) || 100
  )

  let gap=15

  let ancho=
    kanban.clientWidth - 40

  let caben=Math.max(
    1,
    Math.floor(
      (ancho + gap) /
      (minimo + gap)
    )
  )

  let reales=Math.min(
    deseadas,
    caben
  )

  document.documentElement.style
    .setProperty(
      '--real-columns',
      reales
    )
}


function guardar(){

  let data={

    columns:columns.value,
    height:height.value,
    minWidth:minWidth.value,
    view:view.value,

    board:[
      ...kanban.querySelectorAll('.column')
    ].map(column=>({

      title:
        column.querySelector('h3').innerHTML,

      cards:[
        ...column.querySelectorAll('.card')
      ].map(card=>card.innerHTML)

    }))
  }

  localStorage.setItem(
    STORAGE,
    JSON.stringify(data)
  )
}


function cargar(){

  let raw=
    localStorage.getItem(STORAGE)

  if(!raw){
    ajustarColumnas()
    return
  }

  let data

  try{
    data=JSON.parse(raw)
  }catch{
    return
  }


  columns.value=
    data.columns || 3

  height.value=
    data.height || 600

  minWidth.value=
    data.minWidth || 280

  view.value=
    data.view==='row' ? 'row' : 'grid'


  document.documentElement.style
    .setProperty(
      '--height',
      height.value+'px'
    )


  if(Array.isArray(data.board)){

    kanban.innerHTML=''

    data.board.forEach(item=>{

      let column=
        document.createElement('section')

      column.className='column'

      column.innerHTML=`
        <h3 draggable="true"></h3>
        <div class="cards"></div>
        <button class="add-card">
          + Agregar tarjeta
        </button>
      `

      column.querySelector('h3')
        .innerHTML=item.title || ''

      let cards=
        column.querySelector('.cards')

      ;(item.cards || []).forEach(text=>{

        let card=
          document.createElement('div')

        card.className='card'
        card.draggable=true
        card.innerHTML=text

        cards.append(card)
      })

      kanban.append(column)
    })
  }

  ajustarColumnas()
}


function editar(el,seleccionar=false){

  el.contentEditable=true
  el.draggable=false
  el.focus()

  let range=
    document.createRange()

  range.selectNodeContents(el)

  if(!seleccionar)
    range.collapse(false)

  let selection=
    window.getSelection()

  selection.removeAllRanges()
  selection.addRange(range)
}


columns.oninput=()=>{

  ajustarColumnas()
  guardar()
}


view.onchange=()=>{

  ajustarColumnas()
  guardar()
}


height.oninput=()=>{

  document.documentElement.style
    .setProperty(
      '--height',
      height.value+'px'
    )

  guardar()
}


minWidth.oninput=()=>{

  ajustarColumnas()
  guardar()
}


window.addEventListener(
  'resize',
  ajustarColumnas
)


document.addEventListener(
  'dragstart',
  e=>{

    if(e.target.matches('.card'))
      drag=e.target

    if(e.target.matches('h3'))
      drag=e.target.parentElement

    if(!drag)
      return

    drag?.classList.add('dragging')
  }
)


document.addEventListener(
  'dragend',
  ()=>{

    drag?.classList.remove('dragging')

    drag=null

    guardar()
  }
)


document.addEventListener(
  'dragover',
  e=>{

    e.preventDefault()

    if(!drag)
      return


    if(drag.matches('.card')){

      let column=
        e.target.closest('.column')

      if(!column)
        return

      let cards=
        column.querySelector('.cards')

      let next=[
        ...cards.querySelectorAll(
          '.card:not(.dragging)'
        )
      ].find(card=>{

        let rect=
          card.getBoundingClientRect()

        return e.clientY <
          rect.top +
          rect.height/2
      })

      cards.insertBefore(
        drag,
        next || null
      )

      return
    }


    if(drag.matches('.column')){

      let hovered=
        e.target.closest('.column')

      if(hovered===drag)
        return

      let candidates=[
        ...kanban.querySelectorAll(
          '.column:not(.dragging)'
        )
      ]

      if(!candidates.length){
        kanban.append(drag)
        return
      }

      let target=hovered ||
        candidates.reduce(
          (nearest,column)=>{

            let rect=
              column.getBoundingClientRect()

            let dx=
              e.clientX < rect.left
                ? rect.left-e.clientX
                : e.clientX > rect.right
                  ? e.clientX-rect.right
                  : 0

            let dy=
              e.clientY < rect.top
                ? rect.top-e.clientY
                : e.clientY > rect.bottom
                  ? e.clientY-rect.bottom
                  : 0

            let distance=
              dx*dx + dy*dy

            return !nearest ||
              distance < nearest.distance
                ? {column,distance}
                : nearest
          },
          null
        ).column

      let ordered=[
        ...kanban.querySelectorAll('.column')
      ]

      if(
        ordered.indexOf(drag) <
        ordered.indexOf(target)
      )
        target.after(drag)
      else
        target.before(drag)
    }
  }
)


document.addEventListener(
  'dblclick',
  e=>{

    if(
      !e.target.matches('.card,h3')
    )
      return

    editar(e.target)
  }
)


document.addEventListener(
  'keydown',
  e=>{

    if(
      !e.target.isContentEditable
    )
      return


    if(
      e.key==='Enter' &&
      e.shiftKey
    ){

      if(e.target.matches('h3')){

        e.preventDefault()
        e.target.blur()
      }

      return
    }


    if(e.key==='Enter'){

      e.preventDefault()
      e.target.blur()
    }
  }
)


document.addEventListener(
  'blur',
  e=>{

    if(
      !e.target.isContentEditable
    )
      return

    e.target.contentEditable=false
    e.target.draggable=true

    guardar()
  },
  true
)


document.addEventListener(
  'click',
  e=>{

    if(
      !e.target.matches('.add-card')
    )
      return

    let cards=
      e.target
        .closest('.column')
        .querySelector('.cards')

    let card=
      document.createElement('div')

    card.className='card'
    card.draggable=true
    card.textContent='Nueva tarjeta'

    cards.append(card)

    card.scrollIntoView({
      block:'nearest'
    })

    guardar()

    editar(
      card,
      true
    )
  }
)


document.querySelector('.add-column')
.onclick=()=>{

  let column=
    document.createElement('section')

  column.className='column'

  column.innerHTML=`
    <h3 draggable="true">
      Nueva columna
    </h3>

    <div class="cards"></div>

    <button class="add-card">
      + Agregar tarjeta
    </button>
  `

  kanban.append(column)

  ajustarColumnas()
  guardar()

  editar(
    column.querySelector('h3'),
    true
  )
}


window.addEventListener(
  'pagehide',
  guardar
)


cargar()
</script>

</body>
</html>
